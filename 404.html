<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه پیدا نشد - محمدحسین عسگری ثمرین</title>
    <meta name="description" content="صفحه مورد نظر در سایت محمدحسین عسگری ثمرین یافت نشد." />
    <link rel="stylesheet" href="style.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .error-page{display:flex;justify-content:center;align-items:center;min-height:100vh;background:var(--bg);padding:20px}
        .error-container{max-width:650px;width:100%;padding:60px 50px;background:var(--bg-card);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--border);text-align:center;animation:fadeInUp .8s ease}
        .error-animation{font-size:8rem;font-weight:900;line-height:1;background:linear-gradient(135deg,var(--accent),var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:pulse 2s ease-in-out infinite}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
        .error-title{font-size:2rem;color:var(--primary);margin:16px 0 10px;font-weight:700}
        .error-text{color:var(--text-muted);font-size:1.05rem;margin-bottom:30px;line-height:2}
        .error-actions{display:flex;flex-wrap:wrap;gap:15px;justify-content:center}
        .error-btn{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;padding:14px 32px;border-radius:50px;text-decoration:none;font-weight:600;transition:var(--transition)}
        .error-btn:hover{transform:translateY(-4px);box-shadow:0 8px 30px var(--accent-glow)}
        .error-btn-secondary{background:var(--bg-card);color:var(--text);border:2px solid var(--border)}
        .error-btn-secondary:hover{border-color:var(--accent)}
        @media(max-width:768px){.error-container{padding:40px 25px}.error-animation{font-size:5rem}.error-title{font-size:1.5rem}.error-btn{width:100%;justify-content:center}}
    </style>
</head>
<body class="lang-fa">
    <div class="error-page">
        <div class="error-container">
            <div class="error-animation">۴۰۴</div>
            <h1 class="error-title">صفحه پیدا نشد!</h1>
            <p class="error-text">
                متأسفیم، صفحه‌ای که به دنبال آن هستید وجود ندارد یا حذف شده است.
                <br>ممکن است آدرس را اشتباه وارد کرده باشید.
            </p>
            <div class="error-actions">
                <a href="/" class="error-btn"><i class="fas fa-home" aria-hidden="true"></i> بازگشت به صفحه اصلی</a>
                <a href="#" onclick="history.back();return false;" class="error-btn error-btn-secondary"><i class="fas fa-arrow-right" aria-hidden="true"></i> بازگشت به صفحه قبل</a>
            </div>
        </div>
    </div>
    <script>
        if (localStorage.getItem('dark-mode') === 'true') document.body.classList.add('dark-mode');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <meta name="theme-color" content="#0b1220">
    <title>صفحه پیدا نشد | محمدحسین عسگری ثمرین</title>
    <link rel="stylesheet" href="/style.min.css">
    <style>
        :root { color-scheme: dark light; }
        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            background: var(--bg);
            color: var(--text);
            font-family: 'Vazirmatn', 'Inter', system-ui, sans-serif;
        }
        .error-container {
            width: min(100%, 600px);
            box-sizing: border-box;
            padding: clamp(32px, 7vw, 60px) clamp(24px, 6vw, 50px);
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
        }
        .error-container h1 {
            margin: 0;
            font-size: clamp(4rem, 18vw, 6rem);
            line-height: 1;
            font-weight: 900;
            letter-spacing: -.04em;
            background: linear-gradient(135deg, var(--gold), var(--navy-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .error-container p {
            margin: 20px 0;
            color: var(--text2);
            font-size: clamp(1rem, 3vw, 1.2rem);
        }
        .error-container a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 28px;
            border-radius: 999px;
            background: var(--navy);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .error-container a:hover,
        .error-container a:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,.14);
        }
        .error-container .sub {
            margin-top: 20px;
            color: var(--text3);
            font-size: .82rem;
        }
        @media (prefers-reduced-motion: reduce) {
            .error-container a { transition: none; }
        }
    </style>
    <link rel="stylesheet" href="/assets/modern-ui-2026.css">
  <link rel="stylesheet" href="/assets/responsive-fix-2026.css">    <link rel="stylesheet" href="/assets/theme-contrast-2026.css">
  <link rel="stylesheet" href="/assets/final-visual-system-2026.css">
  <link rel="stylesheet" href="/assets/elite-web-system-2026.css">
  <link rel="stylesheet" href="/assets/premium-experience-2026.css">
</head>
<body>
    <main class="error-container" aria-labelledby="error-title">
        <h1 id="error-title">۴۰۴</h1>
        <p>صفحه‌ای که به دنبال آن هستید وجود ندارد.</p>
        <a href="/" aria-label="بازگشت به صفحه اصلی">بازگشت به خانه</a>
        <p class="sub">محمدحسین عسگری ثمرین | متخصص شبکه و زیرساخت</p>
    </main>
    <script src="/assets/modern-ui-2026.js" defer></script>
</body>
</html>

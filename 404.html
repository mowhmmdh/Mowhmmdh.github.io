<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه پیدا نشد - محمدحسین عسگری ثمرین</title>
    <link rel="stylesheet" href="style.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: var(--bg);
            font-family: 'Vazirmatn', 'Inter', sans-serif;
            padding: 20px;
        }
        .error-container {
            max-width: 600px;
            padding: 60px 50px;
            background: var(--bg2);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            text-align: center;
        }
        .error-container h1 {
            font-size: 6rem;
            margin: 0;
            background: linear-gradient(135deg, var(--gold), var(--navy-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            font-family: 'Playfair Display', serif;
        }
        .error-container p {
            color: var(--text2);
            font-size: 1.2rem;
            margin: 20px 0;
            font-weight: 400;
        }
        .error-container .icon {
            font-size: 4rem;
            color: var(--text3);
            margin-bottom: 10px;
            display: block;
        }
        .error-container a {
            display: inline-block;
            background: linear-gradient(135deg, var(--navy), var(--navy-light));
            color: #fff;
            padding: 16px 40px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            margin-top: 10px;
            font-family: 'Inter', 'Vazirmatn', sans-serif;
        }
        body.dark .error-container a { background: linear-gradient(135deg, var(--gold), var(--navy-light)); color: var(--navy-dark); }
        .error-container a:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(26,42,58,0.04);
        }
        .error-container .sub {
            color: var(--text3);
            font-size: 0.8rem;
            margin-top: 20px;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <span class="icon"><i class="fas fa-compass"></i></span>
        <h1>۴۰۴</h1>
        <p>صفحه‌ای که به دنبال آن هستید وجود ندارد.</p>
        <a href="/"><i class="fas fa-home"></i> بازگشت به خانه</a>
        <p class="sub">محمدحسین عسگری ثمرین | متخصص شبکه و زیرساخت</p>
    </div>
</body>
</html>

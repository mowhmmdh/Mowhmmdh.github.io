name: Free Site Automation Team

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"
      - "sitemap.xml"
      - "**/*.html"
      - "assets/**"

permissions:
  contents: read

concurrency:
  group: free-site-automation-team
  cancel-in-progress: true

jobs:
  technical-seo:
    name: Specialist 01 — Technical SEO and page integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run site and SEO audits
        continue-on-error: true
        run: |
          mkdir -p reports
          set +e
          python3 scripts/quality-audit.py > reports/quality-audit.txt 2>&1
          quality_rc=$?
          python3 scripts/seo-deep-audit.py > reports/seo-deep-audit.txt 2>&1
          seo_rc=$?
          set -e
          cat reports/quality-audit.txt
          cat reports/seo-deep-audit.txt
          echo "Quality audit exit: $quality_rc; SEO audit exit: $seo_rc"
          if [ "$quality_rc" -ne 0 ] || [ "$seo_rc" -ne 0 ]; then exit 1; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specialist-01-technical-seo
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  asset-integrity:
    name: Specialist 02 — Assets and internal references
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Audit local assets and references
        continue-on-error: true
        run: |
          mkdir -p reports
          python3 scripts/asset-reference-audit.py > reports/asset-reference-audit.txt 2>&1
          rc=$?
          cat reports/asset-reference-audit.txt
          echo "Asset audit exit code: $rc"
          exit "$rc"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specialist-02-assets
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  release-and-runtime:
    name: Specialist 03 — Release readiness and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run release smoke tests
        continue-on-error: true
        run: |
          mkdir -p reports
          python3 scripts/release-smoke-test.py > reports/release-smoke-test.txt 2>&1
          rc=$?
          cat reports/release-smoke-test.txt
          echo "Smoke test exit code: $rc"
          exit "$rc"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specialist-03-release-readiness
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  content-discovery:
    name: Specialist 04 — RSS and sitemap discovery
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate RSS and sitemap without modifying files
        continue-on-error: true
        run: |
          mkdir -p reports
          set +e
          python3 scripts/rss-feed-audit.py > reports/rss-feed-audit.txt 2>&1
          rss_rc=$?
          python3 - <<'PY' > reports/sitemap-validation.txt 2>&1
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("sitemap.xml")
          if not path.is_file():
              raise SystemExit("ERROR: sitemap.xml is missing")
          root = ET.fromstring(path.read_text(encoding="utf-8"))
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [((e.text or "").strip()) for e in root.findall("sm:url/sm:loc", ns)]
          if not urls:
              raise SystemExit("ERROR: sitemap contains no URLs")
          invalid = [u for u in urls if not u.startswith("https://mowhmmdh.github.io/")]
          if invalid:
              raise SystemExit("ERROR: unexpected URL(s): " + ", ".join(invalid[:10]))
          duplicates = sorted({u for u in urls if urls.count(u) > 1})
          if duplicates:
              raise SystemExit("ERROR: duplicate sitemap URLs: " + ", ".join(duplicates[:10]))
          print(f"Sitemap XML valid; {len(urls)} unique URLs checked.")
          PY
          sitemap_rc=$?
          set -e
          cat reports/rss-feed-audit.txt
          cat reports/sitemap-validation.txt
          echo "RSS audit exit: $rss_rc; sitemap validation exit: $sitemap_rc"
          if [ "$rss_rc" -ne 0 ] || [ "$sitemap_rc" -ne 0 ]; then exit 1; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specialist-04-discovery
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  coordination-report:
    name: Specialist 05 — Coordination and combined status
    if: always()
    needs: [technical-seo, asset-integrity, release-and-runtime, content-discovery]
    runs-on: ubuntu-latest
    steps:
      - name: Publish run summary
        env:
          SEO_RESULT: ${{ needs.technical-seo.result }}
          ASSET_RESULT: ${{ needs.asset-integrity.result }}
          RELEASE_RESULT: ${{ needs.release-and-runtime.result }}
          DISCOVERY_RESULT: ${{ needs.content-discovery.result }}
        run: |
          {
            echo "# Free Site Automation Team"
            echo
            echo "Run time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo
            echo "| Specialist | Result |"
            echo "|---|---|"
            echo "| Technical SEO and page integrity | $SEO_RESULT |"
            echo "| Assets and internal references | $ASSET_RESULT |"
            echo "| Release readiness | $RELEASE_RESULT |"
            echo "| RSS and sitemap discovery | $DISCOVERY_RESULT |"
            echo
            echo "Audit logs are attached as workflow artifacts. These are automated deterministic checks, not independent generative-AI agents."
            echo "This workflow is read-only: it does not edit site files, publish content, or push commits."
          } >> "$GITHUB_STEP_SUMMARY"

name: Temporary Quality Diagnostics
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run quality audit and preserve diagnostics
        shell: bash
        run: |
          set +e
          python3 scripts/quality-audit.py 2>&1 | tee quality-audit.txt
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-audit-diagnostics
          path: quality-audit.txt
          retention-days: 2

name: PageSpeed Optimization 2026

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pagespeed-optimize-main
  cancel-in-progress: true

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Optimize published HTML resources
        run: python3 scripts/pagespeed-optimize-2026.py
      - name: Validate optimizer output
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          pages = [p for p in Path('.').rglob('*.html') if '.git' not in p.parts and '.github' not in p.parts and p.name != '404.html']
          errors=[]
          for p in pages:
              s=p.read_text(encoding='utf-8',errors='replace')
              css=len(re.findall(r'<link\\b[^>]*rel=["\\']stylesheet["\\'][^>]*>',s,re.I))
              if css > 2: errors.append(f'{p}: {css} stylesheet requests remain')
              if '<link rel="stylesheet"' not in s: errors.append(f'{p}: stylesheet missing')
              if '<main' in s and '<a class="skip-link"' not in s and '<a id="skip-to-content" class="skip-link"' not in s: errors.append(f'{p}: skip link missing')
          if errors:
              print('\\n'.join(errors)); sys.exit(1)
          print(f'PageSpeed resource validation passed for {len(pages)} HTML pages.')
      - name: Commit optimized pages
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No PageSpeed changes needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: optimize HTML CSS requests and image loading [skip ci]'
          git push origin HEAD:main

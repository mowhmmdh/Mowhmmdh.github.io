name: GitLab CI/CD Article Static Enhancement QA

on:
  pull_request:
    branches: [main]
    paths:
      - "blog/gitlab-ci-cd-for-it-infrastructure.html"
      - "assets/site-final-quality-2026.js"
      - "assets/site-final-quality-2026.css"
      - "assets/site-theme.js"
      - "assets/site-bundle.css"
      - "tests/test_gitlab_article_navigation.py"
      - "scripts/gitlab-ci-cd-for-it-infrastructure-browser-qa.cjs"
      - ".github/workflows/gitlab-ci-cd-static-enhancement.yml"

permissions:
  contents: read

concurrency:
  group: gitlab-ci-cd-static-enhancement-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run focused source regression tests
        run: python3 -m unittest discover -s tests -p "test_gitlab_article_navigation.py" -v

  browser-and-lighthouse:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--mowhmmdh.netlify.app/blog/gitlab-ci-cd-for-it-infrastructure.html
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pinned free browser and Lighthouse tooling
        run: npm install --global playwright@1.56.1 lighthouse@13.6.0 @sentry/node@11.13.0 @sentry/core@11.13.0
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Wait for Netlify deploy preview
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..48}; do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' "$PREVIEW_URL" || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Netlify deploy preview did not return HTTP 200: $PREVIEW_URL"
          exit 1
      - name: Run desktop and mobile Chromium checks
        id: browser_qa
        run: |
          mkdir -p qa-artifacts
          NODE_PATH="$(npm root -g)" node scripts/gitlab-ci-cd-for-it-infrastructure-browser-qa.cjs
      - name: Resolve immutable Netlify deploy permalink for Lighthouse
        env:
          NETLIFY_DEPLOY_ID: ${{ steps.browser_qa.outputs.netlify_deploy_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$NETLIFY_DEPLOY_ID" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "A valid immutable Netlify deploy ID was not detected; refusing a mutable-preview Lighthouse run."
            exit 1
          fi
          path="${PREVIEW_URL#https://deploy-preview-${PR_NUMBER}--mowhmmdh.netlify.app}"
          target="https://${NETLIFY_DEPLOY_ID}--mowhmmdh.netlify.app${path}"
          for attempt in {1..48}; do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' "$target" || true)
            if [ "$code" = "200" ]; then
              echo "LIGHTHOUSE_URL=$target" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          echo "Immutable Lighthouse target did not return HTTP 200: $target"
          exit 1
      - name: Run mobile Lighthouse 13.6.0
        run: |
          lighthouse "$LIGHTHOUSE_URL" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=qa-artifacts/lighthouse-mobile.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
      - name: Run desktop Lighthouse 13.6.0
        run: |
          lighthouse "$LIGHTHOUSE_URL" --only-categories=performance,accessibility,best-practices,seo --preset=desktop --output=json --output-path=qa-artifacts/lighthouse-desktop.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
      - name: Validate clean Lighthouse reports and print diagnostics
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const [formFactor, file] of [
            ['mobile', 'qa-artifacts/lighthouse-mobile.json'],
            ['desktop', 'qa-artifacts/lighthouse-desktop.json']
          ]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const reportText = JSON.stringify(report);
            if (String(report.requestedUrl || '').includes('deploy-preview-') ||
                String(report.finalDisplayedUrl || '').includes('deploy-preview-')) {
              throw new Error(formFactor + ': Lighthouse used a mutable deploy-preview URL.');
            }
            if (reportText.includes('app.netlify.com/cdp/') ||
                reportText.includes('/.netlify/scripts/cdp')) {
              throw new Error(formFactor + ': Netlify CDP instrumentation contaminated Lighthouse.');
            }
            const categories = report.categories || {};
            const scores = {};
            for (const key of ['performance', 'accessibility', 'best-practices', 'seo']) {
              const score = categories[key]?.score;
              if (typeof score !== 'number' || !Number.isFinite(score)) {
                throw new Error(formFactor + ': missing Lighthouse category ' + key);
              }
              scores[key] = Math.round(score * 100);
            }
            const audits = report.audits || {};
            const requests = audits['network-requests']?.details?.items || [];
            const scriptRequested = requests.some(item => {
              try { return new URL(item.url).pathname === '/assets/site-final-quality-2026.js'; }
              catch (_) { return String(item.url || '').includes('/assets/site-final-quality-2026.js'); }
            });
            if (scriptRequested) {
              throw new Error(formFactor + ': removed enhancement script was still requested.');
            }
            const longTasks = audits['long-tasks']?.details?.items || [];
            const removedScriptTask = longTasks.find(item =>
              String(item.url || '').includes('/assets/site-final-quality-2026.js')
            );
            if (removedScriptTask) {
              throw new Error(formFactor + ': removed enhancement script still owns a long task.');
            }
            console.log(JSON.stringify({
              formFactor,
              scores,
              metrics: {
                fcp: audits['first-contentful-paint']?.displayValue || null,
                lcp: audits['largest-contentful-paint']?.displayValue || null,
                tbt: audits['total-blocking-time']?.displayValue || null,
                cls: audits['cumulative-layout-shift']?.displayValue || null
              },
              mainThread: audits['mainthread-work-breakdown']?.details?.items || [],
              unusedCss: audits['unused-css-rules']?.displayValue || null,
              remainingLongTasks: longTasks.slice(0, 8).map(item => ({
                url: item.url || 'Unattributable',
                duration: item.duration
              })),
              note: 'Immutable Netlify preview lab data only; not production or field Core Web Vitals.'
            }, null, 2));
          }
          NODE
      - name: Upload browser screenshots, report and Lighthouse JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitlab-cicd-browser-lighthouse
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14

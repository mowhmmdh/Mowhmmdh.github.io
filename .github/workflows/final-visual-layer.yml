name: Apply final visual layer
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply site-wide theme runtime safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed=[]
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8')
              original=s
              # The JS is the only runtime theme controller. It contains only visual color overrides,
              # so it cannot alter page grids, spacing, typography, or responsive breakpoints.
              if '/assets/site-theme.js' not in s and '</body>' in s:
                  s=s.replace('</body>','<script src="/assets/site-theme.js" defer></script>\n</body>',1)
              # Keep the standalone light layer available for pages whose local CSS has hard-coded dark colors.
              if '/assets/light-mode-fix-2026.css' not in s and '</head>' in s:
                  s=s.replace('</head>','<link rel="stylesheet" href="/assets/light-mode-fix-2026.css">\n</head>',1)
              if s!=original:
                  p.write_text(s,encoding='utf-8'); changed.append(str(p))
          print('Updated:', *changed, sep='\n- ')
          PY
      - name: Validate generated HTML references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bad=[]
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8')
              if '/assets/site-theme.js' not in s: bad.append(f'{p}: missing site-theme.js')
              if '/assets/light-mode-fix-2026.css' not in s: bad.append(f'{p}: missing light-mode-fix-2026.css')
          if bad:
              print('\n'.join(bad))
              raise SystemExit(1)
          print('All HTML pages have the shared theme runtime and light-mode compatibility layer.')
          PY
      - name: Commit visual layer changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html' 2>/dev/null || true
          git diff --cached --quiet || (git commit -m 'fix(theme): apply shared theme runtime to all pages' && git push)
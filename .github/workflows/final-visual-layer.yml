name: Apply final visual layer
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate site-wide visual stack
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          remove = [
              '/assets/responsive-fix-2026.css',
              '/assets/theme-contrast-2026.css',
              '/assets/site-quality-2026.css',
              '/assets/final-visual-system-2026.css',
              '/assets/elite-web-system-2026.css',
              '/assets/premium-experience-2026.css',
              '/assets/site-wide-premium-2026.css',
              '/assets/editorial-experience-2026.css',
              '/assets/light-mode-fix-2026.css',
          ]
          changed=[]
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8')
              original=s
              # Remove the accumulated visual layers that were overriding each other.
              for href in remove:
                  s=s.replace(f'<link rel="stylesheet" href="{href}">','')
              # One stable layer is loaded last, after each page's own CSS, so it can fix theme
              # colors and mobile overflow without rewriting page-specific layout systems.
              if '/assets/stable-ui-2026.css' not in s and '</head>' in s:
                  s=s.replace('</head>','<link rel="stylesheet" href="/assets/stable-ui-2026.css">\n</head>',1)
              if '/assets/site-theme.js' not in s and '</body>' in s:
                  s=s.replace('</body>','<script src="/assets/site-theme.js" defer></script>\n</body>',1)
              if s!=original:
                  p.write_text(s,encoding='utf-8'); changed.append(str(p))
          print('Updated:', *changed, sep='\n- ')
          PY
      - name: Validate final page stack
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          removed = [
              'responsive-fix-2026.css','theme-contrast-2026.css','site-quality-2026.css',
              'final-visual-system-2026.css','elite-web-system-2026.css','premium-experience-2026.css',
              'site-wide-premium-2026.css','editorial-experience-2026.css','light-mode-fix-2026.css'
          ]
          bad=[]
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8')
              if '/assets/stable-ui-2026.css' not in s: bad.append(f'{p}: missing stable-ui-2026.css')
              if '/assets/site-theme.js' not in s: bad.append(f'{p}: missing site-theme.js')
              for x in removed:
                  if x in s: bad.append(f'{p}: stale visual layer {x}')
          if bad:
              print('\n'.join(bad))
              raise SystemExit(1)
          print('Visual stack is consolidated and every HTML page has the stable UI layer + theme runtime.')
          PY
      - name: Commit visual stack changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html' 2>/dev/null || true
          git diff --cached --quiet || (git commit -m 'refactor(ui): consolidate site-wide visual layers' && git push)
name: Site Quality 2026

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate HTML quality baseline
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          errors=[]
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8',errors='replace')
              if len(re.findall(r'<meta\s+name=["\']viewport["\'][^>]*>',s,re.I))>1:
                  errors.append(f'{p}: duplicate viewport meta')
              if '/assets/stable-ui-2026.css' not in s:
                  errors.append(f'{p}: stable UI layer missing')
              if '/assets/site-theme.js' not in s and 'vintech' not in p.as_posix().lower():
                  errors.append(f'{p}: theme runtime missing')
          print(f'HTML files checked: {sum(1 for p in Path(".").rglob("*.html") if ".git" not in p.parts)}')
          if errors:
              for e in errors: print('ERROR:',e)
              sys.exit(1)
          print('PASS: unified responsive/theme stack is present and viewport metadata is sane.')

      - name: Validate links and SEO essentials
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse, unquote
          import re, sys
          BASE='https://mowhmmdh.github.io'
          pages=sorted(p for p in Path('.').rglob('*.html') if '.git' not in p.parts and p.name!='404.html')
          known={p.as_posix() for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts}
          errors=[]
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.title=0; self.h1=0; self.desc=0; self.canonical=[]; self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs); rel=a.get('rel','').lower().split()
                  if tag=='title': self.title+=1
                  if tag=='h1': self.h1+=1
                  if tag=='meta' and a.get('name','').lower()=='description' and a.get('content',''): self.desc+=1
                  if tag=='link' and 'canonical' in rel: self.canonical.append(a.get('href',''))
                  if tag=='a' and a.get('href'): self.links.append(a['href'])
          for p in pages:
              q=P(); q.feed(p.read_text(encoding='utf-8',errors='replace')); rel=p.as_posix()
              if q.title!=1: errors.append(f'{rel}: expected one title')
              if q.h1!=1: errors.append(f'{rel}: expected one H1, found {q.h1}')
              if q.desc!=1: errors.append(f'{rel}: missing meta description')
              if len(q.canonical)!=1 or not q.canonical[0].startswith(BASE): errors.append(f'{rel}: canonical missing/invalid')
              for href in q.links:
                  href=unquote(href.strip()); u=urlparse(href)
                  if not href or href.startswith(('#','mailto:','tel:','javascript:')) or (u.scheme in ('http','https') and u.netloc not in ('','mowhmmdh.github.io')): continue
                  target=u.path.lstrip('/') if u.scheme else (p.parent/u.path).as_posix()
                  if target.endswith('/'): target+='index.html'
                  if not target: target='index.html'
                  if target not in known: errors.append(f'{rel}: broken local link -> {href}')
          if errors:
              for e in errors: print('ERROR:',e)
              sys.exit(1)
          print(f'PASS: {len(pages)} pages passed title/H1/description/canonical/local-link checks.')
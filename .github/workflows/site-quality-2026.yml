name: Site Quality 2026

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize HTML quality layer
        shell: python
        run: |
          from pathlib import Path
          import re
          
          changed = []
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              s = p.read_text(encoding='utf-8')
              original = s
              
              # Remove accidental duplicate viewport declarations while preserving the first one.
              seen_viewport = False
              def viewport(m):
                  nonlocal seen_viewport
                  if seen_viewport:
                      return ''
                  seen_viewport = True
                  return m.group(0)
              s = re.sub(r'<meta\s+name=["\']viewport["\'][^>]*>', viewport, s, flags=re.I)
              
              # Add the shared conservative quality layer once.
              if '/assets/site-quality-2026.css' not in s:
                  marker = re.search(r'</head>', s, flags=re.I)
                  if marker:
                      s = s[:marker.start()] + '  <link rel="stylesheet" href="/assets/site-quality-2026.css">\n' + s[marker.start():]
              
              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))
          
          print(f'Normalized {len(changed)} HTML files')
          for x in changed:
              print(x)

      - name: Validate critical SEO and HTML signals
        shell: python
        run: |
          from pathlib import Path
          import re
          
          errors=[]
          pages=[p for p in Path('.').rglob('*.html') if '.git' not in p.parts and p.name!='404.html']
          for p in pages:
              s=p.read_text(encoding='utf-8')
              if not re.search(r'<title>\s*[^<]{10,}\s*</title>',s,re.I): errors.append(f'{p}: missing/short title')
              if not re.search(r'name=["\']description["\'][^>]+content=["\'][^"\']{40,}["\']',s,re.I): errors.append(f'{p}: missing/short description')
              if not re.search(r'rel=["\']canonical["\']',s,re.I): errors.append(f'{p}: missing canonical')
              if s.lower().count('name="viewport"') + s.lower().count("name='viewport'") > 1: errors.append(f'{p}: duplicate viewport')
          
          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)
          print(f'Critical checks passed for {len(pages)} HTML pages')

      - name: Commit normalization
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No normalization changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html' assets/site-quality-2026.css
          git commit -m 'chore(quality): normalize HTML viewport and shared quality layer [skip ci]'
          git push

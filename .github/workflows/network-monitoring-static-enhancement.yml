name: Network Monitoring Article Static Enhancement QA

on:
  pull_request:
    branches: [main]
    paths:
      - "blog/network-monitoring-basics.html"
      - "tests/test_network_monitoring_static_enhancements.py"
      - "scripts/network-monitoring-browser-qa.cjs"
      - ".github/workflows/network-monitoring-static-enhancement.yml"
      - "assets/site-bundle.css"
      - "assets/site-final-quality-2026.css"
      - "assets/site-theme.js"
      - "fonts/**"

permissions:
  contents: read

concurrency:
  group: network-monitoring-static-enhancement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run focused source regression tests
        run: python3 -m unittest discover -s tests -p "test_network_monitoring_static_enhancements.py" -v

  browser-and-lighthouse:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--mowhmmdh.netlify.app/blog/network-monitoring-basics.html
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install free browser and Lighthouse tooling
        run: npm install --global playwright@1.56.1 lighthouse@13
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Wait for Netlify deploy preview
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..48}; do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' "$PREVIEW_URL" || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Netlify deploy preview did not return HTTP 200: $PREVIEW_URL"
          exit 1
      - name: Run desktop and mobile Chromium checks
        run: |
          mkdir -p qa-artifacts
          NODE_PATH="$(npm root -g)" node scripts/network-monitoring-browser-qa.cjs
      - name: Run mobile Lighthouse
        run: |
          lighthouse "$PREVIEW_URL" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=qa-artifacts/lighthouse-mobile.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
      - name: Run desktop Lighthouse
        run: |
          lighthouse "$PREVIEW_URL" --only-categories=performance,accessibility,best-practices,seo --preset=desktop --output=json --output-path=qa-artifacts/lighthouse-desktop.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
      - name: Report Lighthouse scores and metrics
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const [name, file] of [
            ['mobile', 'qa-artifacts/lighthouse-mobile.json'],
            ['desktop', 'qa-artifacts/lighthouse-desktop.json']
          ]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const categories = report.categories || {};
            const required = ['performance', 'accessibility', 'best-practices', 'seo'];
            const scores = {};
            for (const key of required) {
              const score = categories[key]?.score;
              if (typeof score !== 'number' || !Number.isFinite(score)) {
                throw new Error(name + ': missing or invalid Lighthouse category ' + key);
              }
              scores[key] = Math.round(score * 100);
            }
            const audits = report.audits || {};
            console.log(JSON.stringify({
              formFactor: name,
              scores,
              metrics: {
                fcp: audits['first-contentful-paint']?.displayValue || null,
                lcp: audits['largest-contentful-paint']?.displayValue || null,
                tbt: audits['total-blocking-time']?.displayValue || null,
                cls: audits['cumulative-layout-shift']?.displayValue || null
              },
              note: 'Preview lab data only; not production or field Core Web Vitals.'
            }, null, 2));
          }
          NODE
      - name: Explain preview SEO scope
        run: |
          echo "SEO is reported but not gated: Netlify deploy previews intentionally return x-robots-tag: noindex. This is not a production indexability measurement."
      - name: Upload screenshots, browser report and Lighthouse JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-monitoring-browser-lighthouse
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14

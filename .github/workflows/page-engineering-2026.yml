name: Page Engineering 2026

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page-engineering-main
  cancel-in-progress: false

jobs:
  engineer:
    name: Page engineering validation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Normalize global CSS layers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/normalize-css-layers.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '*.html'
            git commit -m "chore: normalize CSS layers [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Validate page experience layer
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/page-experience-2026.css
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          pages=[p for p in Path('.').rglob('*.html') if '.git' not in p.parts]
          errors=[]
          for p in pages:
              s=p.read_text(encoding='utf-8',errors='ignore')
              if len(re.findall(r'<meta\s+name=["\']viewport["\'][^>]*>',s,re.I))>1:
                  errors.append(f'{p}: duplicate viewport')
          print(f'HTML pages checked: {len(pages)}')
          if errors:
              print('\n'.join(errors));sys.exit(1)
          print('Page engineering validation passed.')
          PY

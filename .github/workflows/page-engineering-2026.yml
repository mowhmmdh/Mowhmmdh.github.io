name: Page Engineering 2026
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  engineer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate page experience layer
        shell: bash
        run: |
          test -f assets/page-experience-2026.css
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          pages=[p for p in Path('.').rglob('*.html') if '.git' not in p.parts]
          errors=[]
          for p in pages:
              s=p.read_text(encoding='utf-8',errors='ignore')
              if len(re.findall(r'<meta\s+name=["\']viewport["\'][^>]*>',s,re.I))>1:
                  errors.append(f'{p}: duplicate viewport')
          print(f'HTML pages checked: {len(pages)}')
          if errors:
              print('\n'.join(errors));sys.exit(1)
          print('Page engineering validation passed.')
          PY

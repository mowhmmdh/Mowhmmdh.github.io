name: DNS Troubleshooting Head Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "blog/dns-troubleshooting.html"
      - "tests/test_dns_troubleshooting_head.py"
      - ".github/workflows/dns-troubleshooting-head-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run focused regression tests
        run: python3 -m unittest discover -s tests -p "test_dns_troubleshooting_head.py" -v

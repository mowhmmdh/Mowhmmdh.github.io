name: Sitewide Visual Regression 2026
on:
  push:
    branches: [professional-visibility-2026]
  pull_request:
    branches: [main]
    paths:
      - '**.html'
      - 'assets/**'
      - 'scripts/sitewide-visual-audit.mjs'
      - '.github/workflows/sitewide-visual-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sitewide-visual-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/site-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/site-server.log
          exit 1
      - name: Audit every HTML page in dark and light modes
        run: node scripts/sitewide-visual-audit.mjs
      - name: Upload screenshots and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitewide-visual-audit
          path: visual-audit-artifacts/
          if-no-files-found: warn
          retention-days: 14

name: Site Complete Audit 2026

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run structural, SEO and accessibility audit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse
          import re, sys

          root=Path('.')
          files=sorted(p for p in root.rglob('*.html') if '.git' not in p.parts and 'node_modules' not in p.parts)
          errors=[]; warnings=[]

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.title=[]; self.desc=[]; self.canonical=[]; self.viewport=[]; self.h1=0; self.lang=None; self.dir=None; self.imgs=[]; self.links=[]; self.og={}; self.twitter={}; self.alts=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='html': self.lang=a.get('lang'); self.dir=a.get('dir')
                  elif tag=='title': self.title.append('')
                  elif tag=='h1': self.h1+=1
                  elif tag=='img': self.imgs.append(a)
                  elif tag=='a': self.links.append((a.get('href',''),a))
                  elif tag=='meta':
                      if a.get('name','').lower()=='description': self.desc.append(a.get('content',''))
                      if a.get('name','').lower()=='viewport': self.viewport.append(a.get('content',''))
                      prop=a.get('property','').lower()
                      if prop.startswith('og:'): self.og[prop]=a.get('content','')
                      name=a.get('name','').lower()
                      if name.startswith('twitter:'): self.twitter[name]=a.get('content','')
                  elif tag=='link':
                      rel=(a.get('rel') or '').lower().split()
                      if 'canonical' in rel: self.canonical.append(a.get('href',''))
              def handle_data(self,data):
                  if self.title: self.title[-1]+=data

          titles={}; descs={}
          for f in files:
              s=f.read_text(encoding='utf-8',errors='ignore'); p=Audit(); p.feed(s)
              if len(p.title)!=1 or not p.title[0].strip(): errors.append(f'{f}: exactly one non-empty title required')
              if len(p.desc)!=1 or not p.desc[0].strip(): errors.append(f'{f}: exactly one non-empty meta description required')
              if p.h1!=1: errors.append(f'{f}: exactly one H1 required (found {p.h1})')
              if not p.lang: errors.append(f'{f}: html lang missing')
              if len(p.viewport)!=1: errors.append(f'{f}: exactly one viewport meta required')
              if len(p.canonical)!=1 or not p.canonical[0].startswith('https://mowhmmdh.github.io/'): errors.append(f'{f}: canonical missing or off-site')
              if 'og:title' not in p.og or 'og:description' not in p.og: warnings.append(f'{f}: OG title/description incomplete')
              for img in p.imgs:
                  if 'alt' not in img: errors.append(f'{f}: image missing alt')
                  elif not str(img.get('alt','')).strip(): warnings.append(f'{f}: empty image alt')
              for href,a in p.links:
                  if href.startswith('http://'): errors.append(f'{f}: mixed-content HTTP link: {href}')
                  if a.get('target')=='_blank' and 'noopener' not in (a.get('rel') or '').lower(): warnings.append(f'{f}: target=_blank should use rel=noopener')
              if p.title: titles.setdefault(re.sub(r'\s+',' ',p.title[0]).strip(),[]).append(str(f))
              if p.desc: descs.setdefault(re.sub(r'\s+',' ',p.desc[0]).strip(),[]).append(str(f))
          for k,v in titles.items():
              if len(v)>1: warnings.append('Duplicate title: '+k+' -> '+', '.join(v))
          for k,v in descs.items():
              if len(v)>1: warnings.append('Duplicate description -> '+', '.join(v))

          bad=[r'Lorem ipsum',r'Coming soon',r'Your Name',r'John Doe',r'example@example.com',r'\bTODO\b',r'\bFIXME\b']
          for f in files:
              s=f.read_text(encoding='utf-8',errors='ignore')
              for pat in bad:
                  if re.search(pat,s,re.I): errors.append(f'{f}: placeholder content detected: {pat}')

          # Never allow common credential formats in tracked text.
          for f in root.rglob('*'):
              if not f.is_file() or '.git' in f.parts: continue
              if f.suffix.lower() not in {'.html','.css','.js','.json','.yml','.yaml','.md','.txt','.xml','.py'}: continue
              try: s=f.read_text(encoding='utf-8',errors='ignore')
              except: continue
              for pat in [r'AKIA[0-9A-Z]{16}',r'ghp_[A-Za-z0-9]{30,}',r'AIza[0-9A-Za-z_-]{30,}',r'-----BEGIN (?:RSA|OPENSSH|EC|DSA) PRIVATE KEY-----']:
                  if re.search(pat,s): errors.append(f'{f}: possible secret pattern detected')

          print(f'Pages audited: {len(files)}')
          print(f'Errors: {len(errors)} | Warnings: {len(warnings)}')
          for x in errors: print('ERROR:',x)
          for x in warnings: print('WARN:',x)
          if errors: sys.exit(1)
          PY

      - name: Validate sitemap XML and canonical host
        shell: python
        run: |
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import sys
          base='https://mowhmmdh.github.io/'
          try: root=ET.parse('sitemap.xml').getroot()
          except Exception as e: print('Invalid sitemap XML:',e); sys.exit(1)
          ns='{http://www.sitemaps.org/schemas/sitemap/0.9}'
          urls=[u.text.strip() for u in root.findall(f'{ns}url/{ns}loc') if u.text and u.text.strip()]
          bad=[u for u in urls if not u.startswith(base) or ' ' in u]
          if bad: print('Invalid sitemap URLs:',*bad,sep='\n'); sys.exit(1)
          if len(urls)!=len(set(urls)): print('Duplicate sitemap URLs detected'); sys.exit(1)
          print(f'Sitemap validation passed: {len(urls)} canonical URLs.')

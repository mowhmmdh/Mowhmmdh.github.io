name: Visual Consistency 2026

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Ensure final visual layers are attached to every HTML page
        shell: python
        run: |
          from pathlib import Path
          import re
          changed=[]
          layers=[
              '/assets/visual-final-pass-2026.css',
              '/assets/last-mile-visual-2026.css',
              '/assets/ultimate-ui-2026.css',
              '/assets/final-appearance-2026.css',
              '/assets/content-theme-2026.css',
              '/assets/visual-master-2026.css',
          ]
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              s=p.read_text(encoding='utf-8',errors='ignore')
              marker=re.search(r'</head>',s,re.I)
              if not marker:
                  continue
              additions=[]
              for href in layers:
                  if href not in s:
                      additions.append(f'    <link rel="stylesheet" href="{href}">')
              if additions:
                  s=s[:marker.start()] + '\n'.join(additions) + '\n' + s[marker.start():]
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          print(f'Normalized visual layers on {len(changed)} pages')
      - name: Visual regression guardrails
        shell: python
        run: |
          from pathlib import Path
          html=[p for p in Path('.').rglob('*.html') if '.git' not in p.parts]
          errors=[]
          for p in html:
              s=p.read_text(encoding='utf-8',errors='ignore')
              for layer in ('/assets/ultimate-ui-2026.css','/assets/final-appearance-2026.css','/assets/content-theme-2026.css','/assets/visual-master-2026.css'):
                  if layer not in s:
                      errors.append(f'{p}: missing {layer}')
          master=Path('assets/visual-master-2026.css').read_text(encoding='utf-8',errors='ignore')
          if '.vt-card:hover' not in master or '@media' not in master:
              errors.append('assets/visual-master-2026.css: missing core VinTech/responsive rules')
          vt=Path('assets/vintech.css').read_text(encoding='utf-8',errors='ignore')
          if '.vt-card:hover{transform:translateY(-8px);border-color:rgba(154,105,5,.28);background:#fff' in vt:
              print('INFO: legacy VinTech hover rule exists; visual-master-2026.css provides the final cross-page cascade.')
          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)
          print(f'Visual guardrails passed for {len(html)} HTML pages')
      - name: Commit normalized pages
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html'
          git commit -m 'chore(ui): attach deterministic visual master layer across all pages [skip ci]'
          git push

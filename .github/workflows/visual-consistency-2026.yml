name: Visual Consistency 2026

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Ensure final visual layer is attached to every HTML page
        shell: python
        run: |
          from pathlib import Path
          import re
          changed=[]
          href='/assets/visual-final-pass-2026.css'
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              s=p.read_text(encoding='utf-8',errors='ignore')
              if href in s:
                  continue
              marker=re.search(r'</head>',s,re.I)
              if not marker:
                  continue
              s=s[:marker.start()] + f'    <link rel="stylesheet" href="{href}">\n' + s[marker.start():]
              p.write_text(s,encoding='utf-8')
              changed.append(str(p))
          print(f'Attached final visual layer to {len(changed)} pages')
      - name: Commit normalized pages
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html'
          git commit -m 'chore(ui): normalize final visual layer across all pages [skip ci]'
          git push

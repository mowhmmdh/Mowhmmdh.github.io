name: Final Quality Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Repository quality audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate audit scripts
        run: python3 -m py_compile scripts/quality-audit.py scripts/seo-deep-audit.py scripts/asset-reference-audit.py scripts/site-integrity-fix.py scripts/pagespeed-optimize-2026.py
      - name: Repository quality audit
        run: python3 scripts/quality-audit.py
      - name: SEO deep audit
        run: python3 scripts/seo-deep-audit.py
      - name: Asset reference audit
        run: python3 scripts/asset-reference-audit.py

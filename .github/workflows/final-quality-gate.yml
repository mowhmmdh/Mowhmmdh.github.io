name: Final Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit HTML SEO, accessibility and responsive foundations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root = Path('.')
          pages = sorted(root.rglob('*.html'))
          errors=[]; warnings=[]
          required = {
            'viewport': re.compile(r'<meta[^>]+name=["\']viewport["\']', re.I),
            'title': re.compile(r'<title>[^<]+</title>', re.I),
            'description': re.compile(r'<meta[^>]+name=["\']description["\']', re.I),
            'robots': re.compile(r'<meta[^>]+name=["\']robots["\']', re.I),
            'canonical': re.compile(r'<link[^>]+rel=["\']canonical["\']', re.I),
          }
          for p in pages:
            s=p.read_text(encoding='utf-8', errors='replace')
            rel=str(p)
            if '<html' not in s.lower(): errors.append(f'{rel}: missing html element')
            if not re.search(r'<html[^>]+lang=',s,re.I): errors.append(f'{rel}: missing html lang')
            for name,rx in required.items():
              if not rx.search(s): errors.append(f'{rel}: missing {name}')
            h1=len(re.findall(r'<h1\b',s,re.I))
            if h1 != 1: warnings.append(f'{rel}: expected 1 H1, found {h1}')
            for img in re.findall(r'<img\b[^>]*>',s,re.I):
              if not re.search(r'\balt=',img,re.I): warnings.append(f'{rel}: image without alt')
            if re.search(r'href=["\']http://',s,re.I): warnings.append(f'{rel}: insecure http internal/external link')
          if not Path('sitemap.xml').exists(): errors.append('sitemap.xml missing')
          if not Path('robots.txt').exists(): errors.append('robots.txt missing')
          if errors:
            print('\nERRORS:')
            print('\n'.join(errors))
            print(f'\n{len(errors)} blocking issue(s).')
            sys.exit(1)
          print(f'Audit passed for {len(pages)} HTML pages.')
          if warnings:
            print('\nWarnings:')
            print('\n'.join(warnings))
          PY

      - name: Validate sitemap is XML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('sitemap.xml')
          print('sitemap.xml is valid XML')
          PY

      - name: Validate robots references sitemap
        shell: bash
        run: |
          set -euo pipefail
          grep -Eiq '^Sitemap:[[:space:]]*https://mowhmmdh\.github\.io/sitemap\.xml[[:space:]]*$' robots.txt
          echo 'robots.txt points to the canonical sitemap'

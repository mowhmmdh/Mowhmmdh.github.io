name: Final Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'

jobs:
  audit:
    name: Fast repository audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: quality-python-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: quality-python-${{ runner.os }}-

      - name: Audit HTML SEO accessibility links and assets
        run: python3 scripts/quality-audit.py

      - name: Validate sitemap XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); print('sitemap.xml: PASS')"

      - name: Validate robots sitemap reference
        run: grep -Eiq '^Sitemap:[[:space:]]*https://mowhmmdh\\.github\\.io/sitemap\\.xml[[:space:]]*$' robots.txt

  lighthouse:
    name: Performance smoke test
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait for GitHub Pages deployment
        run: sleep 10

      - name: Install Lighthouse
        run: npm install --global lighthouse@13

      - name: Lighthouse homepage
        run: |
          mkdir -p reports
          lighthouse https://mowhmmdh.github.io/ --output=json --output-path=reports/home.json --chrome-flags='--headless --no-sandbox' --quiet
          node - <<'NODE'
          const fs=require('fs'); const r=JSON.parse(fs.readFileSync('reports/home.json'));
          const c=r.categories; for(const [k,v] of Object.entries(c)) console.log(`${k}: ${Math.round(v.score*100)}`);
          const required=['performance','accessibility','best-practices','seo'];
          const bad=required.filter(k=>(c[k]?.score??0)<0.8);
          if(bad.length){console.error('Below 80:',bad.join(', '));process.exit(1)}
          NODE

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ github.sha }}
          path: reports/home.json
          retention-days: 7

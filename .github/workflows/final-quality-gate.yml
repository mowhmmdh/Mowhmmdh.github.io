name: Final Quality Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: Repository quality audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/quality-audit.py
      - run: python3 scripts/asset-reference-audit.py
  lighthouse:
    name: Lighthouse 100 (${{ matrix.page }})
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        page: [/, /about.html, /services.html, /projects.html, /vintech.html, /vintech/network-infrastructure.html, /blog/, /blog/network-hardening.html, /en.html, /en-vintech.html]
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install -g lighthouse@13
      - name: Wait for deployed page
        env: {URL: https://mowhmmdh.github.io${{ matrix.page }}}
        run: |
          for i in {1..30}; do code=$(curl -L -s -o /dev/null -w '%{http_code}' "$URL"); [ "$code" = "200" ] && exit 0; sleep 5; done; echo "Pages not ready: $URL"; exit 1
      - name: Lighthouse audit
        env: {URL: https://mowhmmdh.github.io${{ matrix.page }}}
        run: |
          mkdir -p reports
          lighthouse "$URL" --output=json --output-path=reports/report.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('reports/report.json','utf8'));const c=r.categories;const s={};for(const k of ['performance','accessibility','best-practices','seo'])s[k]=Math.round((c[k]?.score??0)*100);console.log(JSON.stringify(s,null,2));const bad=Object.entries(s).filter(([,v])=>v!==100);if(bad.length){console.error('Lighthouse 100 gate failed:',bad);process.exit(1)}
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.page == '/' && 'home' || matrix.page }}
          path: reports/report.json
          retention-days: 14

name: Site Quality Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit HTML, SEO, links and assets
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse, unquote
          import re, sys

          ROOT = Path('.')
          BASE = 'https://mowhmmdh.github.io'
          html_files = sorted(p for p in ROOT.rglob('*.html') if '.git' not in p.parts)
          errors, warnings = [], []

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title = 0; self.description = 0; self.h1 = 0
                  self.canonical = 0; self.lang = None
                  self.images_missing_alt = []
                  self.links = []
                  self.h1_text = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'html': self.lang = a.get('lang')
                  if tag == 'title': self.title += 1
                  if tag == 'h1': self.h1 += 1
                  if tag == 'img' and 'alt' not in a: self.images_missing_alt.append(a.get('src',''))
                  if tag == 'meta' and a.get('name','').lower() == 'description': self.description += 1
                  if tag == 'link' and 'canonical' in [x.strip().lower() for x in a.get('rel','').split()]: self.canonical += 1
                  if tag == 'a' and a.get('href'): self.links.append(a['href'])
              def handle_data(self, data):
                  if self.h1: self.h1_text.append(data.strip())

          known = {p.as_posix() for p in html_files}
          known.update({'sitemap.xml','robots.txt'})
          for p in ROOT.rglob('*'):
              if p.is_file() and '.git' not in p.parts:
                  known.add(p.as_posix())

          for p in html_files:
              parser = Parser()
              parser.feed(p.read_text(encoding='utf-8', errors='replace'))
              rel = p.as_posix()
              if parser.title != 1: errors.append(f'{rel}: expected exactly one <title>')
              if parser.description != 1: errors.append(f'{rel}: expected exactly one meta description')
              if parser.h1 != 1: errors.append(f'{rel}: expected exactly one H1, found {parser.h1}')
              if not parser.lang: errors.append(f'{rel}: missing html lang')
              if parser.canonical != 1: errors.append(f'{rel}: expected exactly one canonical')
              if parser.images_missing_alt: warnings.append(f'{rel}: images missing alt: {parser.images_missing_alt[:5]}')

              for href in parser.links:
                  href = unquote(href.strip())
                  if not href or href.startswith(('#','mailto:','tel:','javascript:')): continue
                  parsed = urlparse(href)
                  if parsed.scheme in ('http','https'):
                      if parsed.netloc and parsed.netloc != 'mowhmmdh.github.io': continue
                      target = parsed.path.lstrip('/')
                  else:
                      target = (p.parent / parsed.path).as_posix()
                  if target.endswith('/'):
                      target = target + 'index.html'
                  if target == '': target = 'index.html'
                  if target not in known and not Path(target).exists():
                      errors.append(f'{rel}: broken local link -> {href}')

          # Sitemap URLs must point at existing canonical pages/files.
          sitemap = ROOT / 'sitemap.xml'
          if not sitemap.exists():
              errors.append('sitemap.xml missing')
          else:
              urls = re.findall(r'<loc>(.*?)</loc>', sitemap.read_text(encoding='utf-8', errors='replace'))
              if not urls: errors.append('sitemap.xml contains no URLs')
              for u in urls:
                  if not u.startswith(BASE): errors.append(f'sitemap URL outside canonical host: {u}')

          # Catch accidental secret material in tracked text files.
          secret_patterns = [
              r'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----',
              r'(?i)api[_-]?key\s*[:=]\s*[\"\'][A-Za-z0-9_\-]{20,}',
              r'(?i)(?:password|passwd|secret|token)\s*[:=]\s*[\"\'][^\"\']{12,}[\"\']',
          ]
          for p in ROOT.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in {'.html','.css','.js','.json','.yml','.yaml','.txt','.md'}: continue
              text = p.read_text(encoding='utf-8', errors='ignore')
              for pat in secret_patterns:
                  if re.search(pat, text):
                      errors.append(f'{p.as_posix()}: possible secret pattern detected')
                      break

          print(f'HTML pages audited: {len(html_files)}')
          print(f'Warnings: {len(warnings)}')
          for w in warnings: print('WARN:', w)
          if errors:
              print(f'Errors: {len(errors)}')
              for e in errors: print('ERROR:', e)
              sys.exit(1)
          print('Site quality audit passed.')

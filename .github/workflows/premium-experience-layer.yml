name: Apply premium experience layer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  premium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply premium CSS to every HTML page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tag='  <link rel="stylesheet" href="/assets/premium-experience-2026.css">\n'
          changed=[]
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8')
              if '/assets/premium-experience-2026.css' not in s and '</head>' in s:
                  s=s.replace('</head>',tag+'</head>',1)
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          print('Updated pages:',len(changed))
          for p in changed: print(' -',p)
          PY
      - name: Commit page-wide premium layer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m 'Apply premium experience system to every page'
            git push
          fi

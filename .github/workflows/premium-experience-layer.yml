name: Apply premium experience layer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate premium assets without rewriting pages
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/premium-experience-2026.css
          test -f assets/site-wide-premium-2026.css
          test -f assets/editorial-experience-2026.css
          echo 'Premium assets validated; HTML is intentionally not rewritten.'

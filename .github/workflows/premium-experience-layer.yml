name: Apply premium experience layer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  premium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply shared premium systems to every HTML page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          layers = [
              '/assets/premium-experience-2026.css',
              '/assets/site-wide-premium-2026.css',
          ]
          changed=[]
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8')
              original=s
              for layer in layers:
                  if layer not in s and '</head>' in s:
                      s=s.replace('</head>',f'  <link rel="stylesheet" href="{layer}">\n</head>',1)
              if s!=original:
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          print('Updated pages:',len(changed))
          for p in changed: print(' -',p)
          PY
      - name: Commit page-wide premium layer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m 'Apply site-wide premium visual system to every page'
            git push
          fi

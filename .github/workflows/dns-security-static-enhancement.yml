name: DNS Security Article Static Enhancement QA

on:
  pull_request:
    branches: [main]
    paths:
      - "blog/dns-security-and-troubleshooting.html"
      - "tests/test_dns_security_static_enhancements.py"
      - "scripts/dns-security-browser-qa.cjs"
      - ".github/workflows/dns-security-static-enhancement.yml"
      - "assets/site-bundle.css"
      - "assets/site-final-quality-2026.css"
      - "assets/site-theme.js"
      - "fonts/**"

permissions:
  contents: read

concurrency:
  group: dns-security-static-enhancement-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run focused source regression tests
        run: python3 -m unittest discover -s tests -p "test_dns_security_static_enhancements.py" -v

  browser-and-lighthouse:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--mowhmmdh.netlify.app/blog/dns-security-and-troubleshooting.html
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pinned free browser and Lighthouse tooling
        run: npm install --global playwright@1.56.1 lighthouse@13.6.0 @sentry/node@11.13.0 @sentry/core@11.13.0
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Wait for Netlify deploy preview
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..48}; do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' "$PREVIEW_URL" || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Netlify deploy preview did not return HTTP 200: $PREVIEW_URL"
          exit 1
      - name: Run desktop and mobile Chromium checks
        id: browser_qa
        run: |
          mkdir -p qa-artifacts
          NODE_PATH="$(npm root -g)" node scripts/dns-security-browser-qa.cjs
      - name: Resolve immutable Netlify deploy permalink for Lighthouse
        env:
          NETLIFY_DEPLOY_ID: ${{ steps.browser_qa.outputs.netlify_deploy_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$NETLIFY_DEPLOY_ID" =~ ^[A-Za-z0-9-]{1,64}$ ]]; then
            echo "Netlify deploy ID missing or invalid; refusing to run Lighthouse against an instrumented preview URL."
            exit 1
          fi
          path="${PREVIEW_URL#https://deploy-preview-${PR_NUMBER}--mowhmmdh.netlify.app}"
          target="https://${NETLIFY_DEPLOY_ID}--mowhmmdh.netlify.app${path}"
          echo "Using immutable Netlify deploy permalink for Lighthouse."
          for attempt in {1..48}; do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' "$target" || true)
            if [ "$code" = "200" ]; then
              echo "LIGHTHOUSE_URL=$target" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          echo "Lighthouse target did not return HTTP 200: $target"
          exit 1
      - name: Run mobile Lighthouse 13.6.0
        run: |
          lighthouse "$LIGHTHOUSE_URL" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=qa-artifacts/lighthouse-mobile.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
      - name: Run desktop Lighthouse 13.6.0
        run: |
          lighthouse "$LIGHTHOUSE_URL" --only-categories=performance,accessibility,best-practices,seo --preset=desktop --output=json --output-path=qa-artifacts/lighthouse-desktop.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
      - name: Report Lighthouse scores and diagnostics
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const [formFactor, file] of [
            ['mobile', 'qa-artifacts/lighthouse-mobile.json'],
            ['desktop', 'qa-artifacts/lighthouse-desktop.json']
          ]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const categories = report.categories || {};
            const scores = {};
            for (const key of ['performance', 'accessibility', 'best-practices', 'seo']) {
              const score = categories[key]?.score;
              if (typeof score !== 'number' || !Number.isFinite(score)) {
                throw new Error(formFactor + ': missing Lighthouse category ' + key);
              }
              scores[key] = Math.round(score * 100);
            }
            const audits = report.audits || {};
            const reportText = JSON.stringify(report);
            if (/deploy-preview-\\d+--mowhmmdh\\.netlify\\.app/i.test(report.requestedUrl || '') ||
                /deploy-preview-\\d+--mowhmmdh\\.netlify\\.app/i.test(report.finalDisplayedUrl || '')) {
              throw new Error(formFactor + ': Lighthouse used a mutable deploy-preview URL instead of an immutable deploy permalink.');
            }
            if (/(?:app\\.netlify\\.com\\/cdp\\/|\\/\\.netlify\\/scripts\\/cdp)/i.test(reportText)) {
              throw new Error(formFactor + ': Netlify Deploy Preview instrumentation was present in the Lighthouse report.');
            }
            const mainThread = audits['mainthread-work-breakdown']?.details?.items || [];
            const longTasks = audits['long-tasks']?.details?.items || [];
            const unusedCss = audits['unused-css-rules']?.details?.items || [];
            console.log(JSON.stringify({
              formFactor,
              scores,
              metrics: {
                fcp: audits['first-contentful-paint']?.displayValue || null,
                lcp: audits['largest-contentful-paint']?.displayValue || null,
                tbt: audits['total-blocking-time']?.displayValue || null,
                cls: audits['cumulative-layout-shift']?.displayValue || null
              },
              mainThreadWork: mainThread,
              longTasks: longTasks.slice(0, 10),
              unusedCss: unusedCss.slice(0, 10),
              note: 'Preview lab data only; no Performance pass is claimed from this narrow static-enhancement change. Netlify preview SEO may be reduced by noindex.'
            }, null, 2));
          }
          NODE
      - name: Upload screenshots, browser report and Lighthouse JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dns-security-article-browser-lighthouse
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14

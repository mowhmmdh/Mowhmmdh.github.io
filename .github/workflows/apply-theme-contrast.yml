name: Legacy theme contrast layer (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check unified theme system
        run: |
          test -f assets/stable-ui-2026.css
          test -f assets/site-theme.js
          echo "PASS: unified theme system is active"
name: DHCP Article Mobile Navigation Regression

on:
  pull_request:
    paths:
      - "blog/dhcp-snooping-dai-network-security.html"
      - "tests/test_dhcp_article_mobile_navigation.py"
      - ".github/workflows/dhcp-article-mobile-navigation.yml"
  push:
    branches: [main]
    paths:
      - "blog/dhcp-snooping-dai-network-security.html"
      - "tests/test_dhcp_article_mobile_navigation.py"
      - ".github/workflows/dhcp-article-mobile-navigation.yml"

permissions:
  contents: read

concurrency:
  group: dhcp-article-mobile-navigation
  cancel-in-progress: true

jobs:
  regression:
    name: Mobile navigation regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run dependency-free regression tests
        run: python3 -m unittest discover -s tests -p "test_dhcp_article_mobile_navigation.py" -v

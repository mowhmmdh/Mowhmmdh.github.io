name: Final clean
on:
  push:
    branches: [final-clean-2026]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/final_clean.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/final_clean.py .github/workflows/final-clean.yml
          git add -A
          git commit -m "fix: finalize English accessibility and breadcrumbs" || exit 0
          git push origin HEAD:final-clean-2026

name: Sitewide SEO and UX audit

on:
  push:
    branches: [main]
    paths-ignore:
      - "SEO-AUDIT-2026.md"
      - ".github/workflows/sitewide-seo-audit.yml"
  workflow_dispatch:

concurrency:
  group: site-mutating-main
  queue: max

permissions:
  contents: read

jobs:
  audit-and-fix:
    if: false # Paused pending approval-gated workflow redesign.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate original editorial growth pages
        run: python3 scripts/editorial-growth-2026.py

      - name: Run sitewide fixer after content generation
        run: python3 scripts/site-audit-fix-2026.py

      - name: Apply traffic conversion and monetization foundation
        run: python3 scripts/monetization-growth-2026.py

      - name: Normalize breadcrumbs and related-content blocks
        run: python3 tools/discovery_sync.py

      - name: Normalize VinTech stylesheet links
        run: python3 scripts/ensure-vintech-css-2026.py

      - name: Report generated changes without writing to main
        if: always()
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No generated changes."
          else
            echo "::notice::Generated changes are not committed or pushed automatically. Review them on a dedicated branch and submit a pull request."
          fi

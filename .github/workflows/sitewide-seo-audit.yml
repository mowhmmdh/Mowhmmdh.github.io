name: Sitewide SEO and UX audit

on:
  push:
    branches: [main]
    paths-ignore:
      - "SEO-AUDIT-2026.md"
      - ".github/workflows/sitewide-seo-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run sitewide fixer
        run: python3 scripts/site-audit-fix-2026.py

      - name: Apply traffic conversion and monetization foundation
        run: python3 scripts/monetization-growth-2026.py

      - name: Generate original editorial growth pages
        run: python3 scripts/editorial-growth-2026.py

      - name: Normalize VinTech stylesheet links
        run: python3 scripts/ensure-vintech-css-2026.py

      - name: Commit safe fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "chore: apply sitewide SEO and UX audit fixes"
          git push

name: SEO Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-content-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap canonical identity in automation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          canonical = 'Mohammad Hossein Asgari Somarin'
          pattern = re.compile(r'Mohammad\s+Hossein\s+Asgar(?:i)?(?:\s+Somar[a-z]+)+', re.I)
          short = re.compile(r'Mohammad\s+Hossein\s+Asgar(?:i)?(?!\s+Somar[a-z]+\b)', re.I)
          fa = 'محمدحسین عسگری ثمرین'
          fa_pattern = re.compile(r'(?:محمدحسین عسگری ثمرین)(?:\s*ثمرین)+')
          exts = {'.html','.css','.js','.json','.jsonld','.txt','.md','.xml','.webmanifest','.yml','.yaml','.py'}
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in exts:
                  continue
              try: text = p.read_text(encoding='utf-8')
              except Exception: continue
              new = pattern.sub(canonical, text)
              new = short.sub(canonical, new)
              new = fa_pattern.sub(fa, new)
              if new != text:
                  p.write_text(new, encoding='utf-8')
          PY

      - name: Normalize canonical identity
        run: python3 scripts/identity-sync-2026.py
      - name: Normalize generated page integrity
        run: python3 scripts/site-integrity-fix.py
      - name: Synchronize bilingual hreflang
        run: python3 tools/seo_sync.py
      - name: Apply advanced SEO growth fixes
        run: python3 scripts/seo-growth-fix.py
      - name: Promote pillar content and topic clusters
        run: python3 scripts/content-growth-sync.py
      - name: Build internal discovery hubs
        run: python3 tools/discovery_sync.py
      - name: Final canonical identity lock
        run: python3 scripts/identity-sync-2026.py
      - name: Final generated page integrity lock
        run: python3 scripts/site-integrity-fix.py
      - name: Run SEO deep audit
        run: python3 scripts/seo-deep-audit.py
      - name: Absolute final identity sanitizer
        run: python3 scripts/canonical-finalize.py
      - name: Commit synchronized SEO metadata and content navigation
        run: |
          if git diff --quiet; then
            echo "No SEO/content synchronization changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No staged changes needed."
            exit 0
          fi
          git commit -m "chore(seo): normalize identity and strengthen site integrity [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to push synchronized SEO/content changes after 3 attempts."
          exit 1

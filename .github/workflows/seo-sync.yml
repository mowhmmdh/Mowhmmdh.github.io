name: SEO Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# SEO generation and the page refactor both rewrite HTML. They must never
# mutate main concurrently, otherwise generated commits race and rebase conflicts.
concurrency:
  group: site-content-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize bilingual hreflang
        run: python3 tools/seo_sync.py
      - name: Build internal discovery hubs
        run: python3 tools/discovery_sync.py
      - name: Commit synchronized SEO metadata
        run: |
          if git diff --quiet; then
            echo "No SEO metadata changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No staged SEO metadata changes needed."
            exit 0
          fi
          git commit -m "chore(seo): synchronize metadata and internal discovery [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to push synchronized SEO metadata after 3 attempts."
          exit 1

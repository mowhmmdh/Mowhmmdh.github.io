name: Blog Index Mobile Navigation Regression

on:
  pull_request:
    paths:
      - "blog/index.html"
      - "assets/site-theme.js"
      - "assets/site-bundle.css"
      - "tests/test_blog_index_mobile_navigation.py"
      - ".github/workflows/blog-index-mobile-navigation.yml"
  push:
    branches: [main]
    paths:
      - "blog/index.html"
      - "assets/site-theme.js"
      - "assets/site-bundle.css"
      - "tests/test_blog_index_mobile_navigation.py"
      - ".github/workflows/blog-index-mobile-navigation.yml"

permissions:
  contents: read

concurrency:
  group: blog-index-mobile-navigation
  cancel-in-progress: true

jobs:
  regression:
    name: Mobile navigation regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run dependency-free regression tests
        run: python3 -m unittest discover -s tests -p "test_blog_index_mobile_navigation.py" -v

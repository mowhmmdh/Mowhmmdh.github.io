name: Finalize 10 of 10
on:
  push:
    branches: [refactor/10-of-10-final]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: python3 scripts/finalize_10.py
      - name: Validate
        run: |
          python3 -m py_compile scripts/finalize_10.py scripts/site-refactor.py scripts/quality-audit.py tools/discovery_sync.py
          ! grep -R "modern-ui-2026.css" --include='*.html' .
          ! grep -R "stable-ui-2026.css" --include='*.html' .
          ! grep -R "site-final-polish.css" --include='*.html' .
          ! grep -R "Mohammad Hossein Asgari Somarin" --include='*.html' .
          ! grep -R "loadStyle('/assets/" assets/site-theme.js assets/modern-ui-2026.js
          python3 scripts/quality-audit.py
      - name: Commit final migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: finalize production architecture and quality gates" || exit 0
          git push origin HEAD:refactor/10-of-10-final

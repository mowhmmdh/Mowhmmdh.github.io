name: Site Refactor - normalize all pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-refactor-main
  cancel-in-progress: true
jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Normalize every HTML page and bundle CSS
        run: python3 scripts/site-refactor.py
      - name: Commit generated refactor if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-bundle.css '*.html' blog/*.html case-studies/*.html en-blog/*.html en-vintech/*.html services/*.html vintech/*.html
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "refactor: normalize all pages and consolidate CSS"
            git push
          fi

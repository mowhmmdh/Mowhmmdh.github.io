name: Site Refactor - normalize all pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
# SEO Sync and this workflow both rewrite HTML. Serialize them so generated
# commits cannot race each other and create merge conflicts.
concurrency:
  group: site-content-main
  cancel-in-progress: false
jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate refactor script
        run: python3 -m py_compile scripts/site-refactor.py
      - name: Normalize every HTML page and bundle CSS
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/site-refactor.py
          rm -rf scripts/__pycache__
      - name: Validate generated bundle and HTML
        run: |
          test -s assets/site-bundle.css
          test "$(find . -name '*.html' -not -path './.git/*' | wc -l)" -gt 0
          ! grep -R "site-bundle.css.*visual-final-pass-2026.css" --include='*.html' .
      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "refactor: normalize all pages and consolidate CSS [skip ci]"
          for attempt in 1 2 3 4 5 6 7; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Generated site refactor pushed on attempt $attempt."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep 2
          done
          echo "Could not push generated refactor after retries."
          exit 1

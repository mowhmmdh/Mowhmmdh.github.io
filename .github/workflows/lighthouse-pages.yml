name: Lighthouse Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: lighthouse-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        page: [/, /about.html, /services.html, /projects.html, /vintech.html, /en.html]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --global lighthouse@13
      - name: Wait for Pages deployment
        run: sleep 60
      - name: Run Lighthouse
        env: {URL: https://mowhmmdh.github.io${{ matrix.page }}}
        run: |
          mkdir -p reports
          lighthouse "$URL" --output=json --output-path="reports/report.json" --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('reports/report.json','utf8'));const c=r.categories;const s={};for(const k of ['performance','accessibility','best-practices','seo'])s[k]=Math.round((c[k]?.score??0)*100);console.log(JSON.stringify(s,null,2));if(Object.values(s).some(v=>v<100))process.exit(1)
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.page == '/' && 'home' || matrix.page }}
          path: reports/report.json
          retention-days: 14

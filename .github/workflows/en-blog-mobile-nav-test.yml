name: English Blog Mobile Navigation Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "en-blog.html"
      - "tests/test_en_blog_mobile_nav.py"
      - ".github/workflows/en-blog-mobile-nav-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Responsive navigation source checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_en_blog_mobile_nav.py" -v

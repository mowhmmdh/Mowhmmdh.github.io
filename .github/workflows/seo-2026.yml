name: SEO 2026
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate technical SEO
        shell: python
        run: |
          from pathlib import Path
          import re, html, json, subprocess
          from datetime import date

          BASE='https://mowhmmdh.github.io'
          PAIRS={
            'index.html':'en.html','en.html':'index.html',
            'about.html':'en-about.html','en-about.html':'about.html',
            'services.html':'en-services.html','en-services.html':'services.html',
            'projects.html':'en-projects.html','en-projects.html':'projects.html',
            'vintech.html':'en-vintech.html','en-vintech.html':'vintech.html',
            'blog/index.html':'en-blog.html','en-blog.html':'blog/index.html',
            'linkedin.html':'en-linkedin.html','en-linkedin.html':'linkedin.html',
          }
          CONFIGS={
            'index.html':('محمدحسین عسگری ثمرین | متخصص شبکه و زیرساخت IT','وب‌سایت رسمی محمدحسین عسگری ثمرین؛ متخصص شبکه و زیرساخت، سرور، امنیت و عملیات فناوری اطلاعات.','fa_IR','profile'),
            'en.html':('Mohammad Hossein Asgari Somarin | Network & Infrastructure Specialist','Official website of Mohammad Hossein Asgari Somarin, focused on network infrastructure, systems, security and IT operations.','en_US','profile'),
            'vintech.html':('وین‌تک | خدمات شبکه، زیرساخت، امنیت و فناوری اطلاعات','وین‌تک؛ خدمات تخصصی شبکه و زیرساخت، امنیت سایبری، سرور، سیستم‌های نظارتی، پشتیبانی IT و وب.','fa_IR','business'),
            'en-vintech.html':('VinTech | Network, Infrastructure, Cybersecurity & IT Services','VinTech provides professional network infrastructure, cybersecurity, servers, CCTV, IT operations and web services.','en_US','business'),
            'services.html':('خدمات فناوری اطلاعات | شبکه، زیرساخت، امنیت و پشتیبانی IT','خدمات تخصصی شبکه و زیرساخت، سرور، امنیت، CCTV، پشتیبانی IT و وب توسط محمدحسین عسگری ثمرین.','fa_IR','services'),
            'en-services.html':('IT Services | Network, Infrastructure, Security & IT Support','Professional network infrastructure, servers, cybersecurity, CCTV, IT operations and web services.','en_US','services'),
            'projects.html':('پروژه‌های شبکه و زیرساخت | محمدحسین عسگری ثمرین','نمونه پروژه‌ها و مطالعات موردی در شبکه، زیرساخت، سرور، امنیت، عملیات IT و وب.','fa_IR','projects'),
            'en-projects.html':('Network & Infrastructure Projects | Mohammad Hossein Asgari Somarin','Practical case studies covering network infrastructure, servers, security, IT operations and web development.','en_US','projects'),
            'about.html':('درباره محمدحسین عسگری ثمرین | متخصص شبکه و زیرساخت','سوابق حرفه‌ای، حوزه‌های تخصصی و مسیر کاری محمدحسین عسگری ثمرین در شبکه، زیرساخت، سیستم‌ها و امنیت.','fa_IR','profile'),
            'en-about.html':('About Mohammad Hossein Asgari Somarin | Network & Infrastructure Specialist','Professional background, technical focus and career path in networking, infrastructure, systems, security and IT operations.','en_US','profile'),
            'linkedin.html':('LinkedIn | فعالیت‌های حرفه‌ای محمدحسین عسگری ثمرین','منتخبی از فعالیت‌ها و نوشته‌های حرفه‌ای محمدحسین عسگری ثمرین درباره شبکه، زیرساخت، امنیت و فناوری اطلاعات.','fa_IR','social'),
            'en-linkedin.html':('LinkedIn | Mohammad Hossein Asgari Somarin','Selected professional posts and technical activity covering networking, infrastructure, security and IT operations.','en_US','social'),
            'blog/index.html':('مقالات شبکه، زیرساخت و امنیت | محمدحسین عسگری ثمرین','مقالات و راهنماهای فنی درباره شبکه، DNS، Active Directory، امنیت، سرور و عملیات IT.','fa_IR','blog'),
            'en-blog.html':('Technical Blog | Network, Infrastructure & Security','Technical articles and notes about networking, infrastructure, security, servers and IT operations.','en_US','blog'),
            'blog/network-hardening.html':('سخت‌سازی شبکه | راهنمای عملی امنیت شبکه','راهنمای فنی سخت‌سازی شبکه، کاهش سطح حمله و بهبود کنترل‌های امنیتی برای زیرساخت‌های سازمانی.','fa_IR','article'),
            'blog/dns-troubleshooting.html':('عیب‌یابی DNS | راهنمای فنی تشخیص و رفع خطا','راهنمای مرحله‌به‌مرحله عیب‌یابی DNS، بررسی رکوردها، کش، Forwarder و مشکلات Resolution.','fa_IR','article'),
            'blog/active-directory-security-basics.html':('مبانی امنیت Active Directory | چک‌لیست عملی','اصول پایه سخت‌سازی Active Directory، مدیریت حساب‌ها، دسترسی‌ها، سرویس‌ها و کاهش ریسک‌های رایج.','fa_IR','article'),
            'blog/active-directory-hardening.html':('سخت‌سازی Active Directory | چک‌لیست فنی','چک‌لیست عملی برای کاهش سطح حمله Active Directory و بهبود امنیت هویت در محیط Windows Server.','fa_IR','article'),
            'blog/vlan-segmentation.html':('VLAN و Segmentation | طراحی شبکه امن و قابل مدیریت','راهنمای طراحی VLAN و Network Segmentation برای جداسازی کاربران، سرورها، تجهیزات و کنترل دسترسی.','fa_IR','article'),
            'en-blog/active-directory-hardening.html':('Active Directory Hardening | Practical Security Checklist','A practical checklist for reducing Active Directory attack surface and improving identity security on Windows Server.','en_US','article'),
            'en-blog/vlan-segmentation.html':('VLAN Segmentation | Designing Secure and Manageable Networks','A practical guide to VLANs and network segmentation for users, servers, devices and access control.','en_US','article'),
            'vintech/network-infrastructure.html':('خدمات شبکه و زیرساخت | طراحی، پیاده‌سازی و مستندسازی | VinTech','خدمات تخصصی طراحی و پیاده‌سازی شبکه، VLAN، Routing، Switching، کابل‌کشی ساخت‌یافته و مستندسازی زیرساخت.','fa_IR','service'),
            'vintech/cybersecurity.html':('خدمات امنیت سایبری | سخت‌سازی، کنترل دسترسی و امنیت شبکه | VinTech','خدمات امنیت سایبری شامل سخت‌سازی، کنترل دسترسی، امنیت شبکه، کاهش سطح حمله و بررسی ریسک‌های زیرساخت.','fa_IR','service'),
            'vintech/servers-systems.html':('خدمات سرور و سیستم‌ها | Windows Server، Linux و زیرساخت | VinTech','پیاده‌سازی و پشتیبانی Windows Server، Linux، Active Directory، DNS، DHCP، مجازی‌سازی و سرویس‌های سازمانی.','fa_IR','service'),
            'vintech/cctv-nvr.html':('خدمات دوربین مداربسته و NVR | طراحی و اجرا | VinTech','طراحی و اجرای سیستم‌های نظارت تصویری، دوربین IP، NVR، ذخیره‌سازی و دسترسی امن به تصاویر.','fa_IR','service'),
            'vintech/it-support.html':('پشتیبانی IT و HelpDesk | عیب‌یابی و عملیات فناوری اطلاعات | VinTech','پشتیبانی تخصصی IT، HelpDesk، عیب‌یابی شبکه و سیستم‌ها، مدیریت رخدادها و نگهداری زیرساخت.','fa_IR','service'),
            'vintech/web-technical-seo.html':('وب و سئوی فنی | بهینه‌سازی، Performance و Technical SEO | VinTech','خدمات فنی وب، بهینه‌سازی Performance، ساختار HTML، داده ساختاریافته، Core Web Vitals و Technical SEO.','fa_IR','service'),
            'en-vintech/network-infrastructure.html':('Network & Infrastructure Services | Design, Deployment & Documentation','Professional network design and deployment including VLAN, routing, switching, structured cabling and documentation.','en_US','service'),
            'en-vintech/cybersecurity.html':('Cybersecurity Services | Hardening, Access Control & Network Security','Cybersecurity services focused on hardening, access control, network security, attack-surface reduction and infrastructure risk.','en_US','service'),
            'en-vintech/servers-systems.html':('Server & Systems Services | Windows Server, Linux & Infrastructure','Windows Server, Linux, Active Directory, DNS, DHCP, virtualization and enterprise systems implementation and support.','en_US','service'),
            'en-vintech/cctv-nvr.html':('CCTV & NVR Services | Design, Deployment & Secure Access','IP camera and NVR design, deployment, storage planning and secure access for video surveillance systems.','en_US','service'),
            'en-vintech/it-support.html':('IT Support & HelpDesk | Troubleshooting & IT Operations','Professional IT support, HelpDesk, network and system troubleshooting, incident handling and infrastructure maintenance.','en_US','service'),
            'en-vintech/web-technical-seo.html':('Web & Technical SEO | Performance, Structured Data & Core Web Vitals','Technical web optimization covering HTML structure, performance, structured data, Core Web Vitals and Technical SEO.','en_US','service'),
          }

          def esc(x):
            return html.escape(re.sub(r'\s+',' ',html.unescape(x)).strip(),quote=True)

          def url(p):
            s=p.as_posix()
            if s=='index.html': return BASE+'/'
            if s=='blog/index.html': return BASE+'/blog/'
            return BASE+'/'+s

          def lastmod(p):
            try:
              return subprocess.check_output(['git','log','-1','--format=%cs','--',p.as_posix()],text=True).strip() or date.today().isoformat()
            except Exception:
              return date.today().isoformat()

          pages=[p for p in Path('.').rglob('*.html') if '.git' not in p.parts and p.as_posix()!='404.html']
          page_keys={p.as_posix() for p in pages}
          canonical_pages=[]

          for p in pages:
            key=p.as_posix(); original=p.read_text(encoding='utf-8'); text=original; cfg=CONFIGS.get(key)
            title_match=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
            desc_match=re.search(r'<meta[^>]+name=["\']description["\'][^>]*content=["\'](.*?)["\']',text,re.I|re.S)
            title=html.unescape(re.sub(r'<[^>]+>','',title_match.group(1)).strip()) if title_match else p.stem.replace('-',' ').title()
            desc=html.unescape(desc_match.group(1)).strip() if desc_match else ''
            if cfg:
              title,desc,locale,kind=cfg
            else:
              lang=re.search(r'<html[^>]+lang=["\']([^"\']+)',text,re.I)
              locale='en_US' if lang and lang.group(1).lower().startswith('en') else 'fa_IR'
              kind='article' if ('/blog/' in '/'+key and key!='blog/index.html') else ('service' if key.startswith(('vintech/','en-vintech/')) else 'webpage')
              if not desc: desc='Technical content about network infrastructure, systems, security and IT operations.' if locale=='en_US' else 'محتوای فنی درباره شبکه، زیرساخت، سیستم‌ها، امنیت و عملیات فناوری اطلاعات.'

            canonical=url(p); lm=lastmod(p)
            text=re.sub(r'<title[^>]*>.*?</title>',f'<title>{esc(title)}</title>',text,count=1,flags=re.I|re.S)
            if not re.search(r'<title',text,re.I): text=text.replace('</head>',f'<title>{esc(title)}</title></head>',1)

            patterns=[
              r'<meta[^>]+name=["\']description["\'][^>]*>',r'<meta[^>]+name=["\']keywords["\'][^>]*>',
              r'<meta[^>]+name=["\']robots["\'][^>]*>',r'<meta[^>]+name=["\']author["\'][^>]*>',
              r'<link[^>]+rel=["\']canonical["\'][^>]*>',r'<link[^>]+rel=["\']alternate["\'][^>]*>',
              r'<meta[^>]+property=["\']og:[^"\']+["\'][^>]*>',r'<meta[^>]+name=["\']twitter:[^"\']+["\'][^>]*>',
              r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>.*?</script>'
            ]
            for pat in patterns:
              text=re.sub(r'[ \t]*'+pat+r'[ \t]*\n?', '', text, flags=re.I|re.S)

            alt=''
            if key in PAIRS and PAIRS[key] in page_keys:
              fa_key=key if locale=='fa_IR' else PAIRS[key]; en_key=key if locale=='en_US' else PAIRS[key]
              alt=(f'\n<link rel="alternate" hreflang="fa" href="{url(Path(fa_key))}">'
                   f'\n<link rel="alternate" hreflang="en" href="{url(Path(en_key))}">'
                   f'\n<link rel="alternate" hreflang="x-default" href="{url(Path(fa_key))}">')

            image=BASE+'/images/vinicon.webp' if kind in ('business','service') else BASE+'/images/profile.webp'
            ogtype='article' if kind=='article' else 'website'
            meta=(f'<meta name="description" content="{esc(desc)}">\n'
                  f'<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">\n'
                  f'<meta name="author" content="Mohammad Hossein Asgari Somarin">\n'
                  f'<link rel="canonical" href="{canonical}">{alt}\n'
                  f'<meta property="og:title" content="{esc(title)}">\n<meta property="og:description" content="{esc(desc)}">\n'
                  f'<meta property="og:type" content="{ogtype}">\n<meta property="og:url" content="{canonical}">\n'
                  f'<meta property="og:locale" content="{locale}">\n<meta property="og:image" content="{image}">\n'
                  f'<meta property="og:image:alt" content="{esc(title)}">\n<meta name="twitter:card" content="summary_large_image">\n'
                  f'<meta name="twitter:title" content="{esc(title)}">\n<meta name="twitter:description" content="{esc(desc)}">\n<meta name="twitter:image" content="{image}">')

            person={'@type':'Person','@id':BASE+'/#person','name':'محمدحسین عسگری ثمرین','alternateName':'Mohammad Hossein Asgari Somarin','jobTitle':'Network & Infrastructure Specialist','url':BASE+'/','image':BASE+'/images/profile.webp','sameAs':['https://github.com/mowhmmdh','https://www.linkedin.com/in/mohammadhosseinasgari/','https://instagram.com/mowhmmdh']}
            lang='fa-IR' if locale=='fa_IR' else 'en-US'
            home={'@type':'WebSite','@id':BASE+'/#website','url':BASE+'/','name':'Mohammad Hossein Asgari Somarin','publisher':{'@id':BASE+'/#person'},'inLanguage':lang}
            if kind=='business':
              schema={'@type':'Organization','@id':BASE+'/vintech.html#organization','name':'VinTech','alternateName':'وین‌تک','url':BASE+'/vintech.html','logo':BASE+'/images/vinicon.webp','description':desc,'founder':{'@id':BASE+'/#person'}}
              graph=[schema,person,{'@type':'WebSite','@id':canonical+'#website','url':canonical,'name':'VinTech','publisher':{'@id':BASE+'/vintech.html#organization'},'inLanguage':lang},{'@type':'WebPage','@id':canonical+'#webpage','url':canonical,'name':title,'isPartOf':{'@id':canonical+'#website'},'about':{'@id':BASE+'/vintech.html#organization'},'inLanguage':lang}]
            elif kind=='profile':
              graph=[person,home,{'@type':'WebPage','@id':canonical+'#webpage','url':canonical,'name':title,'isPartOf':{'@id':BASE+'/#website'},'about':{'@id':BASE+'/#person'},'inLanguage':lang}]
            elif kind=='article':
              graph=[{'@type':'Article','@id':canonical+'#article','headline':title,'description':desc,'url':canonical,'mainEntityOfPage':{'@type':'WebPage','@id':canonical+'#webpage'},'author':{'@id':BASE+'/#person'},'image':image,'inLanguage':lang,'datePublished':lm,'dateModified':lm,'isPartOf':{'@id':BASE+'/#website'},'publisher':{'@id':BASE+'/#person'}}]
            elif kind=='service':
              graph=[{'@type':'Service','@id':canonical+'#service','name':title,'description':desc,'url':canonical,'provider':{'@type':'Organization','@id':BASE+'/vintech.html#organization','name':'VinTech','url':BASE+'/vintech.html'},'areaServed':'Iran','inLanguage':lang}]
            else:
              graph=[{'@type':'WebPage','@id':canonical+'#webpage','name':title,'description':desc,'url':canonical,'isPartOf':home,'inLanguage':lang}]

            crumbs=[{'@type':'ListItem','position':1,'name':'Home' if locale=='en_US' else 'خانه','item':BASE+'/'}]
            if key.startswith(('vintech/','en-vintech/')):
              crumbs.append({'@type':'ListItem','position':2,'name':'VinTech','item':BASE+'/en-vintech.html' if locale=='en_US' else BASE+'/vintech.html'})
            elif key.startswith(('blog/','en-blog/')) and key not in ('blog/index.html','en-blog.html'):
              crumbs.append({'@type':'ListItem','position':2,'name':'Blog' if locale=='en_US' else 'مقالات','item':BASE+'/en-blog.html' if locale=='en_US' else BASE+'/blog/'})
            if key not in ('index.html','en.html','blog/index.html','en-blog.html','vintech.html','en-vintech.html'):
              crumbs.append({'@type':'ListItem','position':len(crumbs)+1,'name':title,'item':canonical})
            graph.append({'@type':'BreadcrumbList','@id':canonical+'#breadcrumb','itemListElement':crumbs})
            schema={'@context':'https://schema.org','@graph':graph}

            text=text.replace('</head>',meta+'\n<script type="application/ld+json">'+json.dumps(schema,ensure_ascii=False,separators=(',',':'))+'</script>\n</head>',1)
            text=re.sub(r'\n[ \t]*\n(?:[ \t]*\n)+','\n\n',text)
            if text != original: p.write_text(text,encoding='utf-8')
            canonical_pages.append((canonical,lm))

          Path('robots.txt').write_text('User-agent: *\nAllow: /\nSitemap: '+BASE+'/sitemap.xml\n',encoding='utf-8')
          out=['<?xml version="1.0" encoding="UTF-8"?>','<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for u,lm in sorted(set(canonical_pages)): out.append(f'  <url><loc>{u}</loc><lastmod>{lm}</lastmod></url>')
          out.append('</urlset>'); Path('sitemap.xml').write_text('\n'.join(out)+'\n',encoding='utf-8')
      - name: Commit SEO changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' robots.txt sitemap.xml
          if git diff --cached --quiet; then echo "SEO already up to date"; else git commit -m "chore(seo): refresh bilingual metadata schema sitemap and robots"; git push; fi

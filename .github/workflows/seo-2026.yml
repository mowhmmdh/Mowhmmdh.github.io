name: SEO 2026
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build technical SEO layer
        shell: python
        run: |
          from pathlib import Path
          import re, html
          from datetime import date

          BASE='https://mowhmmdh.github.io'
          today=date.today().isoformat()
          pages=[]
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              pages.append(p)

          configs={
            'index.html': {
              'title':'محمدحسین عسگری ثمرین | متخصص شبکه و زیرساخت IT',
              'desc':'وب‌سایت رسمی محمدحسین عسگری ثمرین؛ متخصص شبکه و زیرساخت، سرور، امنیت، Windows Server، Linux و عملیات IT.',
              'locale':'fa_IR','type':'profile'
            },
            'en.html': {
              'title':'Mohammad Hossein Asgari Somarin | Network & Infrastructure Specialist',
              'desc':'Official website of Mohammad Hossein Asgari Somarin — network infrastructure, servers, security, Linux, Windows Server and IT operations.',
              'locale':'en_US','type':'profile'
            },
            'vintech.html': {
              'title':'وین‌تک | خدمات شبکه، زیرساخت، امنیت و فناوری اطلاعات',
              'desc':'VinTech؛ ارائه خدمات شبکه و زیرساخت، امنیت شبکه، سرور، دوربین مداربسته، پشتیبانی IT و طراحی وب برای کسب‌وکارها.',
              'locale':'fa_IR','type':'business'
            },
            'services.html': {
              'title':'خدمات فناوری اطلاعات | شبکه، سرور، امنیت و پشتیبانی IT',
              'desc':'خدمات تخصصی شبکه و زیرساخت، سرور، امنیت، CCTV، پشتیبانی IT و توسعه وب توسط محمدحسین عسگری ثمرین.',
              'locale':'fa_IR','type':'website'
            },
            'projects.html': {
              'title':'پروژه‌های شبکه و زیرساخت | محمدحسین عسگری ثمرین',
              'desc':'نمونه پروژه‌های عملی در شبکه، زیرساخت IT، سرور، امنیت، CCTV و توسعه وب.',
              'locale':'fa_IR','type':'website'
            },
            'about.html': {
              'title':'درباره محمدحسین عسگری ثمرین | متخصص شبکه و زیرساخت',
              'desc':'سوابق، مهارت‌ها، گواهینامه‌ها و مسیر حرفه‌ای محمدحسین عسگری ثمرین در شبکه، زیرساخت و فناوری اطلاعات.',
              'locale':'fa_IR','type':'profile'
            },
            'blog/index.html': {
              'title':'مقالات شبکه، زیرساخت و امنیت | محمدحسین عسگری ثمرین',
              'desc':'مقالات و راهنماهای کاربردی درباره شبکه، DNS، Active Directory، امنیت، سرور و عملیات IT.',
              'locale':'fa_IR','type':'blog'
            }
          }

          def rel(p):
              return p.as_posix()
          def url_for(p):
              u=rel(p)
              if u=='index.html': return BASE+'/'
              return BASE+'/'+u
          def clean(s):
              return html.escape(re.sub(r'\\s+',' ',s).strip(), quote=True)

          def remove_tag(text, pattern):
              return re.sub(pattern,'',text,flags=re.I|re.S)

          for p in pages:
              key=rel(p)
              text=p.read_text(encoding='utf-8')
              cfg=configs.get(key)
              if cfg is None and key.startswith('blog/'):
                  m=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
                  title=re.sub(r'<[^>]+>','',m.group(1)).strip() if m else p.stem.replace('-',' ').title()
                  if title.lower().startswith('blog'): title=title.replace('Blog','مقاله',1)
                  desc=f'راهنمای فنی درباره {title}؛ آموزش کاربردی شبکه، زیرساخت، سرور و امنیت IT.'
                  cfg={'title':title+' | مقاله فنی','desc':desc,'locale':'fa_IR','type':'article'}
              if cfg is None:
                  continue

              canonical=url_for(p)
              text=re.sub(r'<title[^>]*>.*?</title>',f'<title>{clean(cfg["title"])}</title>',text,count=1,flags=re.I|re.S)
              if not re.search(r'<title',text,re.I): text=text.replace('</head>',f'<title>{clean(cfg["title"])}</title></head>',1)

              for pat in [r'<meta[^>]+name=["\']description["\'][^>]*>',r'<meta[^>]+name=["\']keywords["\'][^>]*>',r'<meta[^>]+name=["\']robots["\'][^>]*>',r'<meta[^>]+name=["\']author["\'][^>]*>',r'<link[^>]+rel=["\']canonical["\'][^>]*>',r'<meta[^>]+property=["\']og:[^"\']+["\'][^>]*>',r'<meta[^>]+name=["\']twitter:[^"\']+["\'][^>]*>',r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>.*?</script>']:
                  text=re.sub(pat,'',text,flags=re.I|re.S)

              hreflang='''<link rel="canonical" href="{canonical}">\n<link rel="alternate" hreflang="fa" href="{fa}">\n<link rel="alternate" hreflang="en" href="{en}">\n<link rel="alternate" hreflang="x-default" href="{fa}">'''.format(canonical=canonical,fa=BASE+'/',en=BASE+'/en.html')
              if key.startswith('blog/'):
                  hreflang=f'<link rel="canonical" href="{canonical}">'

              keywords='شبکه, زیرساخت شبکه, امنیت شبکه, سرور, فناوری اطلاعات, IT, Network Infrastructure, Network Security, Mohammad Hossein Asgari Somarin' if cfg['type']!='business' else 'وین‌تک, VinTech, خدمات شبکه, زیرساخت شبکه, امنیت شبکه, پشتیبانی IT, دوربین مداربسته, سرور, طراحی وب'
              meta=f'''<meta name="description" content="{clean(cfg['desc'])}">\n<meta name="keywords" content="{clean(keywords)}">\n<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">\n<meta name="author" content="Mohammad Hossein Asgari Somarin">\n{hreflang}\n<meta property="og:title" content="{clean(cfg['title'])}">\n<meta property="og:description" content="{clean(cfg['desc'])}">\n<meta property="og:type" content="website">\n<meta property="og:url" content="{canonical}">\n<meta property="og:locale" content="{cfg['locale']}">\n<meta property="og:image" content="{BASE}/images/profile.webp">\n<meta property="og:image:alt" content="Mohammad Hossein Asgari Somarin — Network & Infrastructure Specialist">\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="{clean(cfg['title'])}">\n<meta name="twitter:description" content="{clean(cfg['desc'])}">\n<meta name="twitter:image" content="{BASE}/images/profile.webp">'''

              if cfg['type']=='business':
                  schema={"@context":"https://schema.org","@graph":[
                    {"@type":"Organization","@id":canonical+'#organization',"name":"وین‌تک","alternateName":"VinTech","url":canonical,"logo":BASE+'/images/vinicon.webp',"description":cfg['desc'],"founder":{"@type":"Person","name":"محمدحسین عسگری ثمرین","alternateName":"Mohammad Hossein Asgari Somarin","url":BASE+'/',"sameAs":["https://www.linkedin.com/in/mohammadhosseinasgari/","https://github.com/mowhmmdh","https://instagram.com/mowhmmdh"]}},
                    {"@type":"WebSite","@id":canonical+'#website',"url":canonical,"name":"VinTech","publisher":{"@id":canonical+'#organization'},"inLanguage":"fa-IR"}
                  ]
              elif cfg['type']=='profile':
                  schema={"@context":"https://schema.org","@graph":[
                    {"@type":"Person","@id":BASE+'/#person',"name":"محمدحسین عسگری ثمرین","alternateName":"Mohammad Hossein Asgari Somarin","jobTitle":"Network & Infrastructure Specialist","url":BASE+'/' if key=='index.html' else canonical,"image":BASE+'/images/profile.webp',"sameAs":["https://github.com/mowhmmdh","https://www.linkedin.com/in/mohammadhosseinasgari/","https://instagram.com/mowhmmdh"]},
                    {"@type":"WebSite","@id":canonical+'#website',"url":canonical,"name":"Mohammad Hossein Asgari Somarin","publisher":{"@id":BASE+'/#person'},"inLanguage":"fa-IR" if cfg['locale']=='fa_IR' else "en-US"}
                  ]
              elif cfg['type']=='article':
                  schema={"@context":"https://schema.org","@type":"Article","headline":cfg['title'].replace(' | مقاله فنی',''),"description":cfg['desc'],"url":canonical,"mainEntityOfPage":{"@type":"WebPage","@id":canonical},"author":{"@type":"Person","name":"محمدحسین عسگری ثمرین","url":BASE+'/'},"publisher":{"@type":"Person","name":"محمدحسین عسگری ثمرین"},"dateModified":today,"image":BASE+'/images/profile.webp','inLanguage':'fa-IR'}
              else:
                  schema={"@context":"https://schema.org","@type":"WebPage","name":cfg['title'],"description":cfg['desc'],"url":canonical,"isPartOf":{"@type":"WebSite","url":BASE+'/'},"inLanguage":"fa-IR"}

              import json
              block=meta+'\n<script type="application/ld+json">'+json.dumps(schema,ensure_ascii=False,separators=(',',':'))+'</script>'
              text=text.replace('</head>',block+'\n</head>',1)
              p.write_text(text,encoding='utf-8')

          # robots.txt
          Path('robots.txt').write_text('User-agent: *\nAllow: /\nSitemap: '+BASE+'/sitemap.xml\n',encoding='utf-8')

          # sitemap.xml from real HTML files
          urls=[]
          for p in sorted(pages):
              u=url_for(p)
              if u.endswith('/404.html'): continue
              urls.append(u)
          xml=['<?xml version="1.0" encoding="UTF-8"?>','<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9" xmlns:xhtml="http://www.w3.org/1999/xhtml">']
          for u in urls:
              xml.append(f'  <url><loc>{u}</loc><lastmod>{today}</lastmod></url>')
          xml.append('</urlset>')
          Path('sitemap.xml').write_text('\n'.join(xml)+'\n',encoding='utf-8')

      - name: Commit SEO changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' robots.txt sitemap.xml
          if git diff --cached --quiet; then
            echo "SEO already up to date"
          else
            git commit -m "chore(seo): refresh metadata schemas sitemap and robots [skip ci]"
            git push
          fi
name: SEO 2026
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate technical SEO
        shell: python
        run: |
          from pathlib import Path
          import re, html, json
          from datetime import date
          BASE='https://mowhmmdh.github.io'
          today=date.today().isoformat()
          configs={
            'index.html':('محمدحسین عسگری ثمرین | متخصص شبکه و زیرساخت IT','وب‌سایت رسمی محمدحسین عسگری ثمرین؛ متخصص شبکه و زیرساخت، سرور، امنیت، Windows Server، Linux و عملیات IT.','fa_IR','profile'),
            'en.html':('Mohammad Hossein Asgari Somarin | Network & Infrastructure Specialist','Official website of Mohammad Hossein Asgari Somarin — network infrastructure, servers, security, Linux, Windows Server and IT operations.','en_US','profile'),
            'vintech.html':('وین‌تک | خدمات شبکه، زیرساخت، امنیت و فناوری اطلاعات','VinTech؛ ارائه خدمات شبکه و زیرساخت، امنیت شبکه، سرور، دوربین مداربسته، پشتیبانی IT و طراحی وب برای کسب‌وکارها.','fa_IR','business'),
            'services.html':('خدمات فناوری اطلاعات | شبکه، سرور، امنیت و پشتیبانی IT','خدمات تخصصی شبکه و زیرساخت، سرور، امنیت، CCTV، پشتیبانی IT و توسعه وب توسط محمدحسین عسگری ثمرین.','fa_IR','web'),
            'projects.html':('پروژه‌های شبکه و زیرساخت | محمدحسین عسگری ثمرین','نمونه پروژه‌های عملی در شبکه، زیرساخت IT، سرور، امنیت، CCTV و توسعه وب.','fa_IR','web'),
            'about.html':('درباره محمدحسین عسگری ثمرین | متخصص شبکه و زیرساخت','سوابق، مهارت‌ها، گواهینامه‌ها و مسیر حرفه‌ای محمدحسین عسگری ثمرین در شبکه، زیرساخت و فناوری اطلاعات.','fa_IR','profile'),
            'blog/index.html':('مقالات شبکه، زیرساخت و امنیت | محمدحسین عسگری ثمرین','مقالات و راهنماهای کاربردی درباره شبکه، DNS، Active Directory، امنیت، سرور و عملیات IT.','fa_IR','blog')
          }
          def esc(x): return html.escape(re.sub(r'\s+',' ',x).strip(),quote=True)
          def url(p):
            s=p.as_posix()
            return BASE+'/' if s=='index.html' else BASE+'/'+s
          pages=list(Path('.').rglob('*.html'))
          for p in pages:
            if '.git' in p.parts: continue
            key=p.as_posix(); text=p.read_text(encoding='utf-8')
            cfg=configs.get(key)
            if not cfg and key.startswith('blog/'):
              m=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
              title=re.sub(r'<[^>]+>','',m.group(1)).strip() if m else p.stem.replace('-',' ')
              cfg=(title+' | مقاله فنی',f'راهنمای فنی درباره {title}؛ آموزش کاربردی شبکه، زیرساخت، سرور و امنیت IT.','fa_IR','article')
            if not cfg: continue
            title,desc,locale,kind=cfg; canonical=url(p)
            text=re.sub(r'<title[^>]*>.*?</title>',f'<title>{esc(title)}</title>',text,count=1,flags=re.I|re.S)
            if not re.search(r'<title',text,re.I): text=text.replace('</head>',f'<title>{esc(title)}</title></head>',1)
            patterns=[r'<meta[^>]+name=["\']description["\'][^>]*>',r'<meta[^>]+name=["\']keywords["\'][^>]*>',r'<meta[^>]+name=["\']robots["\'][^>]*>',r'<meta[^>]+name=["\']author["\'][^>]*>',r'<link[^>]+rel=["\']canonical["\'][^>]*>',r'<link[^>]+hreflang=[^>]+>',r'<meta[^>]+property=["\']og:[^"\']+["\'][^>]*>',r'<meta[^>]+name=["\']twitter:[^"\']+["\'][^>]*>',r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>.*?</script>']
            for pat in patterns: text=re.sub(pat,'',text,flags=re.I|re.S)
            links=f'<link rel="canonical" href="{canonical}">'
            if key in ('index.html','en.html'): links+=f'\n<link rel="alternate" hreflang="fa" href="{BASE}/">\n<link rel="alternate" hreflang="en" href="{BASE}/en.html">\n<link rel="alternate" hreflang="x-default" href="{BASE}/">'
            kw='وین‌تک, VinTech, خدمات شبکه, زیرساخت شبکه, امنیت شبکه, پشتیبانی IT, دوربین مداربسته, سرور, طراحی وب' if kind=='business' else 'شبکه, زیرساخت شبکه, امنیت شبکه, سرور, فناوری اطلاعات, IT, Network Infrastructure, Network Security'
            meta=f'<meta name="description" content="{esc(desc)}">\n<meta name="keywords" content="{esc(kw)}">\n<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">\n<meta name="author" content="Mohammad Hossein Asgari Somarin">\n{links}\n<meta property="og:title" content="{esc(title)}">\n<meta property="og:description" content="{esc(desc)}">\n<meta property="og:type" content="website">\n<meta property="og:url" content="{canonical}">\n<meta property="og:locale" content="{locale}">\n<meta property="og:image" content="{BASE}/images/profile.webp">\n<meta property="og:image:alt" content="Mohammad Hossein Asgari Somarin — Network & Infrastructure Specialist">\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="{esc(title)}">\n<meta name="twitter:description" content="{esc(desc)}">\n<meta name="twitter:image" content="{BASE}/images/profile.webp">'
            person={"@type":"Person","name":"محمدحسین عسگری ثمرین","alternateName":"Mohammad Hossein Asgari Somarin","jobTitle":"Network & Infrastructure Specialist","url":BASE+'/',"image":BASE+'/images/profile.webp',"sameAs":["https://github.com/mowhmmdh","https://www.linkedin.com/in/mohammadhosseinasgari/","https://instagram.com/mowhmmdh"]}
            if kind=='business': schema={"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":canonical+'#organization',"name":"وین‌تک","alternateName":"VinTech","url":canonical,"logo":BASE+'/images/vinicon.webp',"description":desc,"founder":person},{"@type":"WebSite","@id":canonical+'#website',"url":canonical,"name":"VinTech","publisher":{"@id":canonical+'#organization'},"inLanguage":"fa-IR"}]}
            elif kind=='profile': schema={"@context":"https://schema.org","@graph":[person,{"@type":"WebSite","@id":canonical+'#website',"url":canonical,"name":"Mohammad Hossein Asgari Somarin","publisher":{"@id":BASE+'/#person'},"inLanguage":"fa-IR" if locale=='fa_IR' else 'en-US'}]}
            elif kind=='article': schema={"@context":"https://schema.org","@type":"Article","headline":title.replace(' | مقاله فنی',''),"description":desc,"url":canonical,"mainEntityOfPage":{"@type":"WebPage","@id":canonical},"author":person,"dateModified":today,"image":BASE+'/images/profile.webp','inLanguage':'fa-IR'}
            else: schema={"@context":"https://schema.org","@type":"WebPage","name":title,"description":desc,"url":canonical,"isPartOf":{"@type":"WebSite","url":BASE+'/'},"inLanguage":"fa-IR"}
            text=text.replace('</head>',meta+'\n<script type="application/ld+json">'+json.dumps(schema,ensure_ascii=False,separators=(',',':'))+'</script>\n</head>',1)
            p.write_text(text,encoding='utf-8')
          Path('robots.txt').write_text('User-agent: *\nAllow: /\nSitemap: '+BASE+'/sitemap.xml\n',encoding='utf-8')
          urls=[url(p) for p in sorted(pages) if '.git' not in p.parts and not url(p).endswith('/404.html')]
          out=['<?xml version="1.0" encoding="UTF-8"?>','<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']+[f'  <url><loc>{u}</loc><lastmod>{today}</lastmod></url>' for u in urls]+['</urlset>']
          Path('sitemap.xml').write_text('\n'.join(out)+'\n',encoding='utf-8')
      - name: Commit SEO changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' robots.txt sitemap.xml
          if git diff --cached --quiet; then echo "SEO already up to date"; else git commit -m "chore(seo): refresh metadata schema sitemap and robots [skip ci]"; git push; fi
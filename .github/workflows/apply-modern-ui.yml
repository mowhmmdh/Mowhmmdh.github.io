name: Apply 2026 UI layer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate UI assets without rewriting pages
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/modern-ui-2026.css
          test -f assets/modern-ui-2026.js
          echo 'Modern UI assets validated; HTML is intentionally not rewritten.'

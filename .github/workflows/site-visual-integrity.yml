name: Site Visual Integrity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply visual integrity stylesheet to every HTML page
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          while IFS= read -r -d '' file; do
            if ! grep -q 'assets/final-polish-2026.css' "$file"; then
              python3 - "$file" <<'PY'
import pathlib, sys
p = pathlib.Path(sys.argv[1])
s = p.read_text(encoding='utf-8')
needle = '</head>'
if needle.lower() in s.lower():
    i = s.lower().rfind(needle)
    s = s[:i] + '  <link rel="stylesheet" href="/assets/final-polish-2026.css">\n' + s[i:]
    p.write_text(s, encoding='utf-8')
PY
              changed=1
            fi
          done < <(find . -type f -name '*.html' -not -path './.git/*' -print0)

          if [ "$changed" -eq 1 ]; then
            git config user.name 'site-integrity-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- '*.html'
            git commit -m 'fix: apply final visual integrity layer to all pages'
            git push
          else
            echo 'All HTML pages already use the final visual integrity layer.'
          fi

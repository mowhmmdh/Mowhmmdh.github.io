name: Site Visual Integrity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate final visual layer without rewriting pages
        shell: python
        run: |
          from pathlib import Path
          import sys
          pages = [p for p in Path('.').rglob('*.html') if '.git' not in p.parts]
          missing = [str(p) for p in pages if '/assets/final-polish-2026.css' not in p.read_text(encoding='utf-8', errors='replace')]
          if missing:
              print('Pages missing final visual layer:')
              print('\n'.join(missing))
              sys.exit(1)
          print(f'Validated {len(pages)} HTML pages.')
          print('Visual integrity validation passed; no files rewritten.')

name: Sitemap Refresh 2026

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-mutating-main
  queue: max

jobs:
  sitemap:
    if: false # Paused pending approval-gated workflow redesign.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate sitemap
        run: python3 scripts/generate-sitemap.py

      - name: Report generated changes without writing to main
        if: always()
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No generated changes."
          else
            echo "::notice::Generated changes are not committed or pushed automatically. Review them on a dedicated branch and submit a pull request."
          fi

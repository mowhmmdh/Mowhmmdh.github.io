name: Blog Index Static Enhancement QA

on:
  pull_request:
    branches: [main]
    paths:
      - "blog/index.html"
      - "tests/test_blog_index_static_enhancements.py"
      - "scripts/blog-index-browser-qa.cjs"
      - ".github/workflows/blog-index-static-enhancement-qa.yml"
      - "assets/site-bundle.css"
      - "assets/site-final-quality-2026.css"
      - "assets/site-theme.js"
      - "fonts/**"

permissions:
  contents: read

concurrency:
  group: blog-index-static-enhancement-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run blog navigation, RSS and static enhancement regressions
        run: |
          python3 -m unittest discover -s tests -p "test_blog_index_mobile_navigation.py" -v
          python3 -m unittest discover -s tests -p "test_rss_feed_freshness.py" -v
          python3 -m unittest discover -s tests -p "test_blog_index_static_enhancements.py" -v

  browser-and-lighthouse:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--mowhmmdh.netlify.app/blog/
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install free browser and Lighthouse tooling
        run: npm install --global playwright@1.56.1 lighthouse@13
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Wait for Netlify deploy preview
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..48}; do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' "$PREVIEW_URL" || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Netlify deploy preview did not return HTTP 200: $PREVIEW_URL"
          exit 1
      - name: Run desktop and mobile Chromium checks
        run: |
          mkdir -p qa-artifacts
          NODE_PATH="$(npm root -g)" node scripts/blog-index-browser-qa.cjs
      - name: Run mobile Lighthouse 13
        run: lighthouse "$PREVIEW_URL" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=qa-artifacts/lighthouse-mobile.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
      - name: Run desktop Lighthouse 13
        run: lighthouse "$PREVIEW_URL" --only-categories=performance,accessibility,best-practices,seo --preset=desktop --output=json --output-path=qa-artifacts/lighthouse-desktop.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
      - name: Report Lighthouse scores and lab metrics
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const [formFactor, file] of [['mobile', 'qa-artifacts/lighthouse-mobile.json'], ['desktop', 'qa-artifacts/lighthouse-desktop.json']]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const categories = report.categories || {};
            const scores = {};
            for (const key of ['performance', 'accessibility', 'best-practices', 'seo']) {
              const value = categories[key] && categories[key].score;
              if (typeof value !== 'number' || !Number.isFinite(value)) throw new Error('Missing Lighthouse category: ' + key);
              scores[key] = Math.round(value * 100);
            }
            const audits = report.audits || {};
            console.log(JSON.stringify({
              formFactor,
              scores,
              metrics: {
                fcp: audits['first-contentful-paint'] && audits['first-contentful-paint'].displayValue || null,
                lcp: audits['largest-contentful-paint'] && audits['largest-contentful-paint'].displayValue || null,
                tbt: audits['total-blocking-time'] && audits['total-blocking-time'].displayValue || null,
                cls: audits['cumulative-layout-shift'] && audits['cumulative-layout-shift'].displayValue || null
              },
              note: 'Preview lab data only; not production or field Core Web Vitals.'
            }, null, 2));
          }
          NODE
      - name: Explain preview SEO and performance scope
        run: |
          echo "Netlify preview SEO may be reduced by its intentional x-robots-tag: noindex response; this is not production indexability evidence."
          echo "Performance is reported without a pass threshold on this first post-change run. The Main baseline was 72/100 with 1,920 ms TBT and included a 1,128 ms document-attributed long task; removing the shared enhancement script is a narrow reduction, not a claim that the full bottleneck is fixed."
      - name: Upload screenshots, browser report and Lighthouse JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blog-index-browser-lighthouse
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14

name: Shared Navigation Backdrop Browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - "assets/site-bundle.css"
      - "en-blog.html"
      - "scripts/en-blog-mobile-nav-qa.cjs"
      - ".github/workflows/sitewide-nav-overflow-browser-qa.yml"
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Pull request number whose Netlify deploy preview should be audited"
        required: false
        default: "45"
        type: string

permissions:
  contents: read

concurrency:
  group: sitewide-nav-overflow-browser-qa-${{ github.event.pull_request.number || inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number || inputs.pull_request_number || '45' }}--mowhmmdh.netlify.app/
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install free browser tooling
        run: npm install --global playwright@1.56.1
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Wait for Netlify deploy preview
        shell: bash
        run: |
          for i in {1..48}; do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' "$PREVIEW_URL" || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Netlify preview did not return HTTP 200: $PREVIEW_URL"
          exit 1
      - name: Run desktop and mobile navigation checks
        run: |
          mkdir -p qa-artifacts
          NODE_PATH="$(npm root -g)" node scripts/en-blog-mobile-nav-qa.cjs
      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitewide-navigation-overflow-browser-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14

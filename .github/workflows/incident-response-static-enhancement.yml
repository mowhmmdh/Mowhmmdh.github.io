name: Incident Response Static Enhancement Browser and Lighthouse QA

on:
  pull_request:
    branches: [main]
    paths:
      - "blog/incident-response-network-outage.html"
      - "tests/test_incident_response_static_enhancements.py"
      - "scripts/incident-response-browser-qa.cjs"
      - ".github/workflows/incident-response-static-enhancement.yml"
      - "assets/site-bundle.css"
      - "assets/site-final-quality-2026.css"
      - "assets/site-theme.js"
      - "fonts/**"
permissions:
  contents: read

concurrency:
  group: incident-response-static-enhancement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run focused regression tests
        run: python3 -m unittest discover -s tests -p "test_incident_response_static_enhancements.py" -v

  browser-and-lighthouse:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install free browser and Lighthouse tooling
        run: npm install --global playwright@1.56.1 lighthouse@13
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Start local static preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/incident-response-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/blog/incident-response-network-outage.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/incident-response-http.log
          exit 1
      - name: Run desktop and mobile Chromium checks
        env:
          TARGET_URL: http://127.0.0.1:4173/blog/incident-response-network-outage.html
        run: |
          mkdir -p qa-artifacts
          NODE_PATH="$(npm root -g)" node scripts/incident-response-browser-qa.cjs
      - name: Run mobile Lighthouse
        run: |
          lighthouse http://127.0.0.1:4173/blog/incident-response-network-outage.html \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=qa-artifacts/lighthouse-mobile.json \
            --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
      - name: Run desktop Lighthouse
        run: |
          lighthouse http://127.0.0.1:4173/blog/incident-response-network-outage.html \
            --only-categories=performance,accessibility,best-practices,seo \
            --preset=desktop --output=json --output-path=qa-artifacts/lighthouse-desktop.json \
            --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --quiet
      - name: Enforce quality thresholds and print scores
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const thresholds = {
            performance: 90,
            accessibility: 95,
            'best-practices': 95,
            seo: 95
          };
          let failed = false;
          for (const [name, file] of [
            ['mobile', 'qa-artifacts/lighthouse-mobile.json'],
            ['desktop', 'qa-artifacts/lighthouse-desktop.json']
          ]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const scores = {};
            for (const key of Object.keys(thresholds)) {
              const score = report.categories?.[key]?.score;
              if (typeof score !== 'number') {
                throw new Error(name + ': missing Lighthouse category ' + key);
              }
              scores[key] = Math.round(score * 100);
            }
            console.log(JSON.stringify({
              formFactor: name,
              scores,
              metrics: {
                fcp: report.audits?.['first-contentful-paint']?.displayValue,
                lcp: report.audits?.['largest-contentful-paint']?.displayValue,
                tbt: report.audits?.['total-blocking-time']?.displayValue,
                cls: report.audits?.['cumulative-layout-shift']?.displayValue
              }
            }, null, 2));
            for (const [key, minimum] of Object.entries(thresholds)) {
              if (scores[key] < minimum) {
                console.error(name + ': ' + key + ' score ' + scores[key] + ' is below ' + minimum);
                failed = true;
              }
            }
          }
          if (failed) process.exit(1);
          NODE
      - name: Upload browser screenshots and Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: incident-response-browser-lighthouse
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14

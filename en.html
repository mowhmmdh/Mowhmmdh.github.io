        /* ============================================================
           Variables - Light Mode (Default)
           ============================================================ */
        :root {
            --navy: #1a2a3a;
            --navy-light: #2c4a6a;
            --navy-dark: #0f1a2a;
            --gold: #c9a84c;
            --gold-light: #e8d5a8;
            --gold-glow: rgba(201, 168, 76, 0.06);
            --bg: #f5f6f8;
            --bg2: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.35);
            --text: #1a1a2e;
            --text2: #4a5a6a;
            --text3: #8a9aaa;
            --border: rgba(26, 42, 58, 0.02);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.02);
            --shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.04);
            --radius: 16px;
            --transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* ============================================================
           Dark Mode
           ============================================================ */
        body.dark {
            --bg: #0f1a2a;
            --bg2: #1a2a3a;
            --bg-glass: rgba(26, 42, 58, 0.4);
            --text: #f0f4ff;
            --text2: #8a9aaa;
            --text3: #4a5a6a;
            --border: rgba(255, 255, 255, 0.02);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
            --shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.3);
            --gold: #d4b85a;
            --gold-glow: rgba(212, 184, 90, 0.04);
        }

        /* ============================================================
           Reset & Base
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', 'Vazirmatn', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.7;
            transition: background 0.6s, color 0.6s;
            padding: 20px;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 30px;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
           Preloader
           ============================================================ */
        #preloader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s, visibility 0.8s;
        }
        #preloader.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================================
           Custom Cursor
           ============================================================ */
        .cursor-dot {
            position: fixed;
            width: 4px;
            height: 4px;
            background: var(--gold);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
        }
        .cursor-ring {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(201, 168, 76, 0.1);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99998;
            transform: translate(-50%, -50%);
            backdrop-filter: blur(2px);
            transition: width 0.5s, height 0.5s, border-color 0.5s;
        }
        .cursor-ring.hover {
            width: 70px;
            height: 70px;
            border-color: var(--gold);
        }
        @media (max-width: 768px) {
            .cursor-dot, .cursor-ring { display: none; }
            body { cursor: auto; }
        }

        /* ============================================================
           Neural Network Background
           ============================================================ */
        #neural-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.04;
        }

        /* ============================================================
           Navbar
           ============================================================ */
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            width: calc(100% - 40px);
            max-width: 1240px;
            padding: 12px 28px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 80px;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }
        .navbar.scrolled {
            top: 12px;
            padding: 10px 24px;
            box-shadow: var(--shadow-hover);
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            padding: 4px 18px 4px 8px;
            border-radius: 60px;
            border: 1px solid var(--border);
            transition: var(--transition);
            position: relative;
        }
        .logo::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 60px;
            padding: 2px;
            background: conic-gradient(from 0deg, var(--gold), var(--navy-light), var(--gold));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: var(--transition);
        }
        .logo:hover::before {
            opacity: 1;
            animation: spinBorder 4s linear infinite;
        }
        @keyframes spinBorder {
            to { transform: rotate(360deg); }
        }
        .logo img {
            height: 34px;
            width: auto;
            transition: var(--transition);
            border-radius: 50%;
        }
        .logo:hover img { transform: scale(1.04); }
        .logo-text {
            font-family: 'Orbitron', 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(135deg, var(--gold), var(--navy-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }
        body.dark .logo-text {
            background: linear-gradient(135deg, var(--gold), #4a7a9a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-text span {
            -webkit-text-fill-color: rgba(255, 255, 255, 0.05);
        }

        .nav-links {
            display: flex;
            gap: 2px;
            list-style: none;
        }
        .nav-links a {
            font-family: 'Inter', 'Vazirmatn', sans-serif;
            color: var(--text2);
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 40px;
            transition: var(--transition);
            letter-spacing: 0.3px;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text);
            background: var(--gold-glow);
        }
